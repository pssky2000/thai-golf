<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>알람 시험</title>
<style>
:root{--bg:#101614;--card:#1c2622;--line:#2f3d37;--tx:#eef3ef;--sub:#a9b8b0;--pri:#2e9e6a;--warn:#e0a030}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;font-size:17px;line-height:1.5;padding:16px}
h1{font-size:22px;margin:4px 0 6px}
p{margin:6px 0}
.sub{color:var(--sub);font-size:15px}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin:12px 0}
input[type=time]{font-size:26px;font-weight:800;background:#0b100e;color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:6px 10px;width:100%}
a.t{display:block;text-decoration:none;color:var(--tx);background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}
a.t b{font-size:19px}
a.t span{display:block;color:var(--sub);font-size:14px;margin-top:2px}
a.t:active{border-color:var(--pri)}
.fail{background:#3a2a10;border:1.5px solid var(--warn);border-radius:12px;padding:10px 12px;margin:10px 0}
</style>
</head>
<body>
<h1>⏰ 알람 시험 단추</h1>
<p class="sub">하나씩 눌러 보고, <b>시계 앱이 열린 번호</b>와 <b>시각이 채워졌는지</b>를 알려 주세요. 열린 뒤에는 저장하지 말고 뒤로 돌아오면 됩니다.</p>
<div id="fail"></div>
<div class="box">
  <div class="sub">시험할 시각</div>
  <input type="time" id="tm">
</div>
<div id="list"></div>
<p class="sub">아무 일도 없으면 그 번호는 "안 됨"입니다. 주황 칸이 뜨면 Chrome이 "열 앱이 없다"고 돌려보낸 것입니다.<br>앱 아이콘(설치한 앱)으로 열었을 때와 Chrome 주소창으로 열었을 때가 다를 수 있어요.</p>
<script>
var CLOCK_S = 'com.sec.android.app.clockpackage', CLOCK_G = 'com.google.android.deskclock';
var tm = document.getElementById('tm');
var d = new Date(Date.now() + 5 * 60000);
tm.value = ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2);

function back(n) { return encodeURIComponent(location.origin + location.pathname + '?fail=' + n); }
function setAlarm(n, pkg) {
  var p = tm.value.split(':');
  return 'intent:#Intent;action=android.intent.action.SET_ALARM;' + (pkg ? 'package=' + pkg + ';' : '') +
    'i.android.intent.extra.alarm.HOUR=' + Number(p[0]) + ';i.android.intent.extra.alarm.MINUTES=' + Number(p[1]) +
    ';S.android.intent.extra.alarm.MESSAGE=' + encodeURIComponent('알람 시험') + ';S.browser_fallback_url=' + back(n) + ';end';
}
var TESTS = [
  ['알람 맞추기 (처음 방식)', '시계 앱이 알아서 열리고 시각이 채워지는 방식', function () { return setAlarm(1); }],
  ['알람 맞추기 + 삼성 시계 지정', '삼성 시계 앱으로 콕 집어 보냄', function () { return setAlarm(2, CLOCK_S); }],
  ['알람 맞추기 + 구글 시계 지정', '구글 시계 앱이 깔려 있을 때만', function () { return setAlarm(3, CLOCK_G); }],
  ['삼성 시계 앱만 열기', '시각은 안 채워짐 — 앱만 열리면 성공', function () { return 'intent:#Intent;action=android.intent.action.MAIN;category=android.intent.category.LAUNCHER;package=' + CLOCK_S + ';S.browser_fallback_url=' + back(4) + ';end'; }],
  ['알람 목록 열기', '시계 앱의 알람 목록 화면', function () { return 'intent:#Intent;action=android.intent.action.SHOW_ALARMS;S.browser_fallback_url=' + back(5) + ';end'; }],
  ['삼성 시계 앱 열기 (다른 주소 방식)', 'android-app 주소', function () { return 'android-app://' + CLOCK_S; }]
];
var list = document.getElementById('list');
TESTS.forEach(function (t, i) {
  var a = document.createElement('a');
  a.className = 't'; a.href = '#';
  a.innerHTML = '<b>' + (i + 1) + '. ' + t[0] + '</b><span>' + t[1] + '</span>';
  a.onclick = function (e) { e.preventDefault(); location.href = t[2](); };
  list.appendChild(a);
});
var f = /[?&]fail=(\d+)/.exec(location.search);
if (f) document.getElementById('fail').innerHTML = '<div class="fail">⚠️ <b>' + f[1] + '번</b>: Chrome이 "열 수 있는 앱이 없다"며 돌아왔어요 (안 됨).</div>';
</script>
</body>
</html>
