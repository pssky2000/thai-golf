<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<base target="_top">
<title>골프여행</title>
<meta name="theme-color" content="#1f7a4d">
<meta name="color-scheme" content="light dark">
<script>try { var th = JSON.parse(localStorage.getItem('trip_theme')); if (th === 'light' || th === 'dark') document.documentElement.setAttribute('data-theme', th); } catch (e) {}</script>
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<script>
  // GitHub Pages(홈 화면 앱)에서만 화면 파일을 저장해 둠
  if ('serviceWorker' in navigator && location.protocol === 'https:' && /github\.io$/.test(location.hostname)) {
    window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).catch(function () {}); });
  }
</script>
<script>
  // 내 PC에서 미리보기할 때만 가짜 서버를 불러옴 (구글 배포본에서는 실행되지 않음)
  if (/^(localhost|127\.0\.0\.1)$/.test(location.hostname)) {
    document.write('<script src="preview/gas-mock.js"><\/script><script src="Code.gs"><\/script><script src="Setup.gs"><\/script><script src="preview/gas-mock-init.js"><\/script>');
  }
</script>
<style>
:root{
  --bg:#f4f6f3; --card:#ffffff; --ink:#18221b; --sub:#5d6b61; --line:#dfe6e0;
  --pri:#1f7a4d; --pri-ink:#ffffff; --pri-soft:#e3f1e8;
  --warn:#c26a00; --warn-ink:#ffffff; --warn-soft:#fff3e0; --bad:#c62828; --bad-soft:#fdecea; --good:#2e7d32;
  --flight:#3f51b5; --golf:#1f7a4d; --meal:#d35400; --move:#607d8b; --hotel:#6d4c9f; --massage:#ad1457; --shop:#00838f; --rest:#8d6e63; --barc:#b8860b;
  --shadow:0 1px 3px rgba(0,0,0,.08),0 4px 14px rgba(0,0,0,.05);
  --r:16px; --fs:1.3;
  --nav-bg:#d6e8dc; --nav-line:#7fb394;   /* 아래 메뉴: 본문과 구분되는 색 */
  --day-bg:#ffffff; --day-line:#c9dccf;
}
@media (prefers-color-scheme: dark){:root:not([data-theme=light]){
    --bg:#0f1511; --card:#18211b; --ink:#e8efe9; --sub:#9aa9a0; --line:#2a362e;
    --pri:#48b47c; --pri-ink:#08130c; --pri-soft:#1d3326;
    --warn:#ffb74d; --warn-ink:#2a1700; --warn-soft:#3a2a10; --bad:#ef5350; --bad-soft:#3b1a19; --good:#66bb6a;
    --shadow:none;
    --nav-bg:#26342b; --nav-line:#3f6b4f;
    --day-bg:#212e25; --day-line:#3a5143;
  }}
:root[data-theme=dark]{
    --bg:#0f1511; --card:#18211b; --ink:#e8efe9; --sub:#9aa9a0; --line:#2a362e;
    --pri:#48b47c; --pri-ink:#08130c; --pri-soft:#1d3326;
    --warn:#ffb74d; --warn-ink:#2a1700; --warn-soft:#3a2a10; --bad:#ef5350; --bad-soft:#3b1a19; --good:#66bb6a;
    --shadow:none;
    --nav-bg:#26342b; --nav-line:#3f6b4f;
    --day-bg:#212e25; --day-line:#3a5143;
  }
/* 화면 밝기: 자동(폰 설정) / 밝게 / 어둡게. color-scheme을 밝혀 두면 Chrome이 멋대로 어둡게 바꾸지 않음 */
:root{color-scheme:light dark}
:root[data-theme=light]{color-scheme:light}
:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box}
html{background:var(--bg);min-height:100%}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;font-size:calc(16px*var(--fs));line-height:1.45;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--pri)}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px 120px}
.hidden{display:none!important}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;margin:12px 0}
.muted{color:var(--sub)}
.small{font-size:calc(13px*var(--fs))}
.row{display:flex;gap:8px;align-items:center}
.between{justify-content:space-between}
.wrap-row{flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 14px;min-height:44px;white-space:nowrap}
.row>.btn{flex-shrink:0}
.tgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}
.tgrid button{min-height:42px;padding:6px 0;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;font-size:min(calc(15px*var(--fs)),4.6vw);font-variant-numeric:tabular-nums}
.tgrid button.on{background:var(--pri);border-color:var(--pri);color:var(--pri-ink);font-weight:800}
.tp-now{font-size:calc(30px*var(--fs));font-weight:800;text-align:center;font-variant-numeric:tabular-nums;margin:4px 0}
.act-row{flex-wrap:wrap;gap:6px}.act-row>.btn{padding:10px 9px}
.btn.pri{background:var(--pri);color:var(--pri-ink);border-color:var(--pri);font-weight:700}
.btn.ghost{background:transparent}
/* 카드 안 보통 단추는 카드 바탕과 살짝 다르게 (지도/위성 단추처럼, 2026-11-20 사용자: 갤러리 단추가 바탕에 묻힘) */
.card .btn:not(.pri):not(.ghost):not(.bad):not(.on){background:rgba(127,127,127,.2)}
.btn.bad{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:6px 10px;min-height:36px;font-size:calc(14px*var(--fs));border-radius:10px}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:3px 10px;font-size:calc(13px*var(--fs));background:var(--pri-soft);color:var(--pri);font-weight:600}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
input.inp,select.inp,textarea.inp{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 12px;min-height:44px}
label.lb{display:block;font-size:calc(13px*var(--fs));color:var(--sub);margin:10px 0 4px}

/* 헤더 */
header.top{padding:14px 0 4px}
.title{font-size:calc(20px*var(--fs));font-weight:800;margin:0}
.dday{font-weight:800;color:var(--pri);white-space:nowrap;margin-left:8px}
header.top .title{font-size:calc(17px*var(--fs));line-height:1.25}

/* 항공 카드 */
.flights{display:grid;gap:10px}
@media(min-width:720px){.flights{grid-template-columns:1fr 1fr}}
.flight{border-radius:var(--r);padding:14px 16px;background:linear-gradient(135deg,#0d47a1,#1e88e5);color:#fff}   /* 가는 날: 파랑 */
.flight.back{background:linear-gradient(135deg,#b23c00,#ef7d00)}   /* 오는 날: 주황 */
/* 요약 화면 날짜 상자: 바탕과 구분 */
.daycard{background:var(--day-bg);border:1px solid var(--day-line);border-left:6px solid var(--pri)}
.daycard .dhead{color:var(--pri)}
.flight .lbl{font-size:calc(13px*var(--fs));opacity:.9;font-weight:700;white-space:nowrap}
.flight .no{font-size:calc(15px*var(--fs));font-weight:800;letter-spacing:.5px;white-space:nowrap}
.flight .fhead{flex-wrap:wrap;row-gap:2px}
.flight .times{display:flex;align-items:center;justify-content:space-between;margin:8px 0 4px}
.flight .t{font-size:calc(30px*var(--fs));font-weight:800;line-height:1}
.flight .ap{font-size:calc(13px*var(--fs));opacity:.9}
.flight .arrow{font-size:calc(20px*var(--fs));opacity:.8}
.flight .meta{font-size:calc(13px*var(--fs));opacity:.92;margin-top:6px}
.flight .fnote>div{margin-top:2px}
.flight .times{align-items:flex-start}
.flight .times .arrow{align-self:center}
.flight .meet-link{color:#fff;text-decoration:underline}
.flight .kr{font-size:calc(12px*var(--fs));opacity:.8}

/* 환율 */
.fx-grid{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center}
.fx-grid input{text-align:right;font-size:calc(18px*var(--fs));font-weight:700}
.fx-head{text-align:right;line-height:1.45}
.fx-head>div{white-space:nowrap}
.fx-wrap{position:relative}
.fx-ch{width:100%;height:auto;display:block;margin-top:4px;touch-action:pan-y}
.fx-line{fill:none;stroke:var(--pri);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.fx-gl{stroke:var(--line);stroke-width:1}
.fx-st{stroke:var(--sub);stroke-width:1.2;stroke-dasharray:4 4;opacity:.8}
.fx-ax{font-size:10px;fill:var(--sub)} .fx-lb{font-size:10.5px;fill:var(--ink);font-weight:700}
.fx-dot,.fx-hdot{fill:var(--pri);stroke:var(--card);stroke-width:2}
.fx-cross{stroke:var(--sub);stroke-width:1}
.fx-hit{fill:transparent;cursor:crosshair}
.fx-tip{position:absolute;top:0;background:var(--ink);color:var(--card);border-radius:8px;padding:3px 8px;font-size:calc(12px*var(--fs));white-space:nowrap;pointer-events:none}
.fx-tip b{color:inherit}
.fx-rg{display:flex;gap:4px}
.fx-rg button{border:1px solid var(--line);background:transparent;color:var(--sub);border-radius:999px;padding:3px 10px;font:inherit;font-size:calc(12px*var(--fs));cursor:pointer;min-height:30px}
.fx-rg button.on{background:var(--pri);border-color:var(--pri);color:var(--pri-ink);font-weight:700}

/* 탭 */
nav.tabs{position:sticky;top:0;z-index:20;background:var(--bg);padding:8px 0;margin:0 -16px;border-bottom:1px solid var(--line)}
.tabs-in{display:flex;gap:6px;overflow-x:auto;padding:0 16px;scrollbar-width:none}
.tabs-in::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:6px 12px;text-align:center;min-width:64px}
.tab .d{font-weight:800;font-size:calc(15px*var(--fs));display:block}
.tab .s{font-size:calc(12px*var(--fs));color:var(--sub);display:block;white-space:nowrap}
.tab.on{background:var(--pri);border-color:var(--pri);color:var(--pri-ink)}
.tab.on .s{color:var(--pri-ink);opacity:.85}
.tab.today:not(.on){border-color:var(--pri);box-shadow:inset 0 0 0 1px var(--pri)}
.tab.drop{outline:3px dashed var(--warn)}

/* 다음 일정 */
.next{display:flex;gap:10px;align-items:center;border-radius:var(--r);padding:12px 12px 12px 14px;background:linear-gradient(135deg,#c2410c,#e8590c);color:#fff;box-shadow:0 4px 14px rgba(232,89,12,.35)}
.next.soon{background:linear-gradient(135deg,#b71c1c,#d32f2f);box-shadow:0 4px 14px rgba(211,47,47,.45);animation:nxpulse 1.6s ease-in-out infinite}
@keyframes nxpulse{50%{box-shadow:0 0 0 6px rgba(211,47,47,.25)}}
@media (prefers-reduced-motion:reduce){.next.soon{animation:none}}
.next{margin-bottom:12px}
.next .nx-i{font-size:calc(26px*var(--fs));line-height:1}
.next .nx-b{flex:1;min-width:0}
.next .nx-l{font-size:calc(12px*var(--fs));font-weight:700;opacity:.9}
.next .big{font-size:calc(18px*var(--fs));font-weight:800;line-height:1.25}
.next .nx-p{font-size:calc(13px*var(--fs));opacity:.92;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.next .nx-left{flex:none;background:#fff;color:#c2410c;border-radius:12px;padding:6px 10px;text-align:center;font-weight:800;line-height:1.15;min-width:calc(60px*var(--fs))}
.next.soon .nx-left{color:#c62828}
/* 비행기 알림: 항공 카드(가는 날 파랑·오는 날 주황)와 헷갈리지 않게 진한 장미색 */
.next.fl{background:linear-gradient(135deg,#9f1239,#e11d48);box-shadow:0 4px 14px rgba(225,29,72,.4)}
.next.fl .nx-left{color:#be123c}
.next.fl.soon{animation:nxpulse2 1.6s ease-in-out infinite}
@keyframes nxpulse2{50%{box-shadow:0 0 0 6px rgba(225,29,72,.3)}}
@media (prefers-reduced-motion:reduce){.next.fl.soon{animation:none}}
.next .nx-time{font-size:calc(28px*var(--fs));font-weight:800;line-height:1.1;letter-spacing:.5px}
.next .nx-from{font-size:calc(15px*var(--fs));font-weight:800;letter-spacing:0}
.next .nx-air{font-size:calc(13px*var(--fs));margin-top:2px}
.next .nx-left b{display:block;font-size:calc(17px*var(--fs));white-space:nowrap}
.next .nx-left span{font-size:calc(12px*var(--fs))}
.golf-day{display:flex;gap:12px;align-items:center;width:100%;margin:10px 0 12px;border-radius:var(--r);padding:12px 16px;background:var(--card);border:2px solid var(--pri);color:var(--ink);font:inherit;text-align:left;cursor:pointer}
.golf-day .gi{font-size:calc(28px*var(--fs))}
.golf-day .gt{flex:1;min-width:0;display:flex;flex-direction:column}
.golf-day .gt .small{color:var(--sub)}
.golf-day .gt b{font-size:calc(19px*var(--fs));color:var(--pri);word-break:keep-all}
.golf-day .gx{font-size:calc(24px*var(--fs));color:var(--sub)}

/* 날씨 */
.wx{display:flex;gap:14px;align-items:center}
.wx .ico{font-size:calc(34px*var(--fs))}
.wx .temp{font-size:calc(22px*var(--fs));font-weight:800}

/* 날짜 화면 */
.day-grid{display:block}
.day-grid .map-col{margin:12px 0}
@media(min-width:960px){
  .day-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
  .day-grid .list-col{grid-column:1;grid-row:1}
  .day-grid .map-col{grid-column:2;grid-row:1;position:sticky;top:76px;margin:0}
}
.map-head{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 12px}
.map-head>b{white-space:nowrap}
.mapsw{display:grid;grid-template-columns:1fr 1fr;flex:none;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.mapsw button{border:0;background:rgba(127,127,127,.2);color:var(--ink);font:inherit;font-size:calc(13px*var(--fs));padding:5px 12px;min-width:calc(48px*var(--fs));text-align:center;cursor:pointer;white-space:nowrap}
.mapsw button.on{background:var(--pri);color:#fff;font-weight:700}
.edit-btn{width:100%;margin:4px 0 8px;border-style:dashed;border-width:1.5px;border-color:var(--pri);color:var(--pri);font-weight:700}
.edit-on{border:2px solid var(--pri)}
.tl{list-style:none;margin:0;padding:0}
.it{display:flex;gap:10px;align-items:stretch;background:var(--card);border:1px solid var(--line);border-radius:14px;margin:8px 0;padding:10px 12px;box-shadow:var(--shadow);touch-action:pan-y}
.it .tm{width:calc(54px*var(--fs));flex:0 0 calc(54px*var(--fs));font-weight:800;font-variant-numeric:tabular-nums}
.it .tm .lock{font-size:calc(12px*var(--fs))}
.it .bar{width:4px;border-radius:4px;background:var(--move)}
.it .body{flex:1;min-width:0}
.it .ttl{font-weight:700}
.it .plc{font-size:calc(14px*var(--fs));color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.imap-wrap{position:relative}.imap-sw{position:absolute;top:8px;right:8px;z-index:500;background:var(--card)}
.imap{height:calc(190px*var(--fs));border-radius:12px;overflow:hidden;margin:10px 0 0;border:1px solid var(--line);background:#cfd8d2}
/* 닫기: 다른 단추와 다르게 테두리만 (2026-11-21 사용자: 색이 같아 구분 안 됨) */
.btn.close-btn{background:transparent!important;border:1.5px solid var(--sub);color:var(--sub);font-weight:700}
.it-head{border-bottom:1.5px solid rgba(127,127,127,.45);padding-bottom:4px;margin-bottom:10px}.it-title{margin:4px 0 0;white-space:nowrap;overflow:hidden}
.pl-blk{display:flex;gap:6px;margin:8px 0 0;align-items:flex-start}.pl-blk .pin{flex:none}
.it .memo.alt{font-size:calc(14px*var(--fs))}.it .memo.alt .ghostpin{visibility:hidden}
.it .memo{font-size:calc(13px*var(--fs));color:var(--sub)}
.it .side{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.it .letter{width:24px;height:24px;border-radius:50%;background:#d93025;color:#fff;font-size:calc(13px*var(--fs));font-weight:800;display:flex;align-items:center;justify-content:center}
.it .handle{font-size:calc(22px*var(--fs));padding:4px 6px;color:var(--sub);touch-action:none;cursor:grab;user-select:none}
.it.dragging{opacity:.9;box-shadow:0 10px 30px rgba(0,0,0,.25);position:relative;z-index:30}
.it.placeholder{border:2px dashed var(--pri);background:transparent;box-shadow:none;outline:2px dashed var(--pri);outline-offset:4px}   /* 끄는 일정이 바로 위에 겹쳐도 바깥 점선은 네 변 다 보임 */
.it.fixed .tm{color:var(--pri)}
.ty-flight .bar{background:var(--flight)} .ty-golf .bar{background:var(--golf)} .ty-meal .bar{background:var(--meal)}
.ty-hotel .bar{background:var(--hotel)} .ty-massage .bar{background:var(--massage)} .ty-shop .bar{background:var(--shop)} .ty-rest .bar{background:var(--rest)} .ty-bar .bar{background:var(--barc)}
.tygrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.tygrid button{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:6px 0 4px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:calc(12px*var(--fs));color:var(--ink);min-width:0}
.tygrid button .e{font-size:calc(24px*var(--fs));line-height:1.1}
.tygrid button.on{border:2px solid var(--pri);background:var(--pri-soft);font-weight:700}
.it .chg{font-size:calc(12px*var(--fs));color:var(--warn);font-weight:700}
.fbox{border:1px solid var(--line);border-radius:14px;padding:10px 12px 12px;margin-top:14px;background:var(--bg)}
.fbox .fbt{font-weight:800;margin-bottom:6px}
.fbox.reco{border-color:var(--warn)}
.rmap{height:260px;border-radius:10px;overflow:hidden;margin-top:8px;background:#ddd}
.rpin{width:28px;height:28px;border-radius:50%;background:#d93025;color:#fff;font:800 14px/24px system-ui,sans-serif;text-align:center;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4);box-sizing:border-box;transition:transform .15s}
.rpin.on{background:#1f7a4d;transform:scale(1.3)}
.rpin.base{background:#1a73e8}
.rcard{border:1px solid var(--line);border-radius:12px;padding:10px;margin-top:8px;background:var(--card)}
.rcard .rno{display:inline-block;min-width:24px;height:24px;border-radius:50%;background:#1f7a4d;color:#fff;text-align:center;font-size:14px;line-height:24px}
.rnav{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;margin-top:10px}
.rnav span{color:var(--sub);text-align:center;white-space:nowrap}
.rnav .btn{width:100%}
.rname{display:block;font-weight:800;font-size:calc(16px*var(--fs));color:var(--ink);text-decoration:none}
.rname .rgo{color:var(--pri);font-size:.85em}
.rsub{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:8px}
.rsub .btn{padding-left:2px;padding-right:2px}
.rsub .btn.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.rpin{width:30px!important;height:30px!important;line-height:26px!important}
.seg{display:flex;align-items:center;gap:8px;margin:0 0 0 calc(70px*var(--fs));font-size:calc(13px*var(--fs));color:var(--sub);flex-wrap:wrap}
.seg .live{border:1px solid var(--line);border-radius:999px;padding:2px 8px;text-decoration:none;color:var(--ink);background:var(--card)}
.seg.late{color:var(--bad);font-weight:700}
.map-box{border-radius:var(--r);overflow:hidden;border:1px solid var(--line);background:var(--card)}
.map-box iframe{width:100%;height:260px;border:0;display:block;background:var(--line)}
@media(min-width:600px){.map-box iframe{height:min(72vw,72vh,680px)}}
/* 오늘 동선 지도: 한 손가락은 화면 위아래로 넘기기, 한 번 누르거나 두 손가락이면 지도 움직이기 (2026-11-17) */
.map-wrap{position:relative}
.share-row{margin-top:10px}.sheet .share-row{margin-top:16px}   /* 창 안: 카톡 단추 위·아래 간격 같게 16 (2026-11-21) */
.fx-line{margin-top:6px;white-space:nowrap}.fx-line b{font-size:calc(15px*var(--fs))}.fx-line .small{font-size:calc(12px*var(--fs))}
.btn.wide{display:flex;width:100%;justify-content:center;text-decoration:none}
.rt svg{width:100%;height:auto;display:block;margin:4px 0 6px}
.rt-sea{fill:var(--flight);opacity:.16}
.rt-road{stroke:var(--sub);stroke-width:4;opacity:.55}
.rt-road2{stroke:var(--sub);stroke-width:3;opacity:.4}
.rt-leg{fill:none;stroke-width:4;stroke-dasharray:7 5;stroke-linecap:round}
.rt-l1,.rt-p1{stroke:var(--warn)} .rt-l2,.rt-p2{stroke:var(--shop)}
.rt-p1{fill:var(--warn)} .rt-p2{fill:var(--shop)}
.rt-ws{fill:var(--massage);opacity:.9}
.rt-tx{font-size:11px;fill:var(--ink)} .rt-sub{fill:var(--sub);font-size:10px} .rt-b{font-weight:800;font-size:12px}
.rt-wst{fill:#fff;font-size:11px} .rt-c1{fill:var(--warn);font-weight:800} .rt-c2{fill:var(--shop);font-weight:800}
.rt-st{display:flex;gap:8px;padding:8px 0;border-top:1px solid var(--line);font-size:calc(13px*var(--fs));color:var(--sub)}
.rt-st b{color:var(--ink)}
.rt-st.on{color:var(--ink)} .rt-st.on>div>b{color:var(--warn)}
.rt-n{flex:none;font-weight:800;font-size:calc(15px*var(--fs))}
.rt-tip{border-top:1px solid var(--line);padding-top:8px;font-size:calc(12px*var(--fs));color:var(--sub)}
.share-c{width:100%;min-height:56px;display:flex;align-items:center;gap:12px;padding:6px 16px;border:0;border-radius:12px;background:#fee500;color:#191919;font:inherit;cursor:pointer;text-align:left}
.share-c svg{width:calc(30px*var(--fs));height:calc(27px*var(--fs));flex:none}
.share-c span{display:flex;flex-direction:column;line-height:1.25;min-width:0}
.share-c b{font-size:calc(15px*var(--fs));font-weight:800}
.share-c small{font-size:calc(12px*var(--fs));color:#3c3c3c;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* 🧪 시험 기본값 칸: 저장·지움·그대로 표, 같은 크기 단추 두 개 */
.bl-tbl{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;margin:8px 0;padding:8px 10px;border-radius:10px;background:color-mix(in srgb,var(--warn) 12%,var(--bg));border:1px solid color-mix(in srgb,var(--warn) 40%,var(--line));font-size:calc(13px*var(--fs));line-height:1.4}
.bl-k{font-weight:700;white-space:nowrap}
.bl-btns{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.bl-btns .btn{width:100%}
.map-cover{position:absolute;inset:0;z-index:2;touch-action:pan-y;cursor:pointer;display:flex;justify-content:center;align-items:flex-start;padding-top:8px}
.map-cover span{background:rgba(0,0,0,.6);color:#fff;border-radius:999px;padding:4px 12px;font-size:calc(12px*var(--fs));pointer-events:none;white-space:nowrap}
.map-cover.off{display:none}
.pts{display:flex;gap:6px;flex-wrap:wrap;padding:10px}
.pt{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:4px 10px;font-size:calc(13px*var(--fs))}
.pt b{color:#d93025}
.pt.on{background:var(--pri);color:var(--pri-ink);border-color:var(--pri)}
.pt.on b{color:var(--pri-ink)}

/* 스코어 */
.rounds{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.sc-me{border:2px solid var(--pri)}
.sc-big{display:grid;grid-template-columns:1fr 1fr;gap:10px;text-align:center}
.sc-big .lab,.sc-total .lab{font-size:calc(13px*var(--fs));color:var(--sub)}
/* 폰: 전반·후반 한 줄, 합계는 후반 바로 아래(같은 가운데 정렬) / 넓은 화면: 전반·후반·합계 한 줄 */
.sc-total{grid-column:2;text-align:center;padding-top:6px;border-top:1px dashed var(--line)}
.sc-total .sum{line-height:1.1}
@media(min-width:600px){
  .sc-big{grid-template-columns:1fr 1fr 1fr}
  .sc-total{grid-column:auto;border-top:0;padding-top:0}
}
.stepper{display:flex;align-items:center;justify-content:center;gap:4px}
.stepper button{width:36px;height:44px;flex:0 0 36px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-size:calc(20px*var(--fs));padding:0}
.stepper input{width:54px;min-width:0;height:50px;text-align:center;font-size:calc(24px*var(--fs));font-weight:800;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:0}
.sum{font-size:calc(30px*var(--fs));font-weight:900;color:var(--pri)}
.holes{display:grid;grid-template-columns:repeat(9,1fr) 1.35fr;gap:4px;margin-top:12px}
/* 4명 함께 입력 (홀마다) */
.grp-nav{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;margin:8px 0}
.grp-nav .hole{text-align:center;font-weight:800;font-size:calc(22px*var(--fs));line-height:1.2}
.grp-nav .hole small{display:block;font-size:calc(13px*var(--fs));font-weight:600;color:var(--sub)}
.grp-nav .btn{min-width:64px}
.grp-chips{display:grid;grid-template-columns:repeat(9,1fr);gap:3px;margin:4px 0 10px}
.grp-chips button{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:5px 0;font:inherit;font-size:calc(12px*var(--fs));font-weight:700;color:var(--sub)}
.grp-chips button.full{background:var(--pri-soft);color:var(--pri);border-color:var(--pri-soft)}
.grp-chips button.part{background:var(--auto)}
.grp-chips button.on{background:var(--pri);color:var(--pri-ink);border-color:var(--pri);box-shadow:0 0 0 3px var(--card),0 0 0 5px var(--pri);font-size:calc(14px*var(--fs));font-weight:900;position:relative;z-index:1}   /* 지금 홀: 꽉 찬 초록 + 바깥 고리 */
.grp-row{display:grid;grid-template-columns:minmax(0,1fr) 84px;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.grp-row .nm{font-weight:800;font-size:calc(17px*var(--fs));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grp-row .nm small{display:block;font-weight:500;font-size:calc(12px*var(--fs));color:var(--sub)}
.grp-row input{width:100%;height:56px;text-align:center;font-size:calc(24px*var(--fs));font-weight:800;border:1px solid var(--line);border-radius:12px;background:var(--bg);padding:0;cursor:pointer;caret-color:transparent}
.grp-row input.picking{outline:3px solid var(--pri);outline-offset:1px}
.grp-row input:disabled{opacity:.45}
.grp-sum{width:100%;border-collapse:collapse;margin-top:10px;font-size:calc(14px*var(--fs))}
.grp-sum th,.grp-sum td{padding:5px 4px;border-top:1px solid var(--line);text-align:center;white-space:nowrap}
.grp-sum th{color:var(--sub);font-weight:600}
.grp-sum td:first-child,.grp-sum th:first-child{text-align:left}
.seg-tabs.six{grid-template-columns:repeat(6,1fr);gap:3px}
/* 정보 탭 5~6칸을 앞화면 한 줄에: 글씨는 화면 폭에 맞춰 줄임(아주 크게여도 넘치지 않게) */
.seg-tabs.six button,.seg-tabs.five button{font-size:min(calc(13px*var(--fs)),4.3vw);letter-spacing:-.07em;padding:10px 0}
.vrow{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;width:100%;text-align:left;border:0;border-top:1px solid var(--line);background:transparent;color:var(--ink);padding:10px 2px;font:inherit;cursor:pointer}
.vrow:first-of-type{border-top:0}
.vrow .ic{font-size:calc(24px*var(--fs))}
.vrow .t{font-weight:700}
.vrow .s{font-size:calc(12px*var(--fs));color:var(--sub)}
.vday{font-weight:800;color:var(--pri);margin:12px 0 2px;font-size:calc(14px*var(--fs))}
.sheet.vview{background:#0b0d0c;color:#eee;padding:10px;max-width:900px;width:100%}
.vview .vbar{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-bottom:8px}
.vview .vbar b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.vview .btn{background:#1d221f;color:#eee;border-color:#333}
.vview .vbody{max-height:78vh;overflow:auto;background:#222;border-radius:8px;-webkit-overflow-scrolling:touch}
.vview .vbody img,.vview .vbody canvas{display:block;margin:0 auto 6px;background:#fff}
.meet-grid{display:grid;grid-template-columns:auto 1fr;gap:2px 8px;align-items:start}
.meet-grid>span{white-space:nowrap}
.meet-grid>div>div{margin-bottom:2px}
.scan-thumbs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
/* 날짜별 사진 */
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
.pth{position:relative;border:0;padding:0;border-radius:10px;overflow:hidden;background:var(--line);aspect-ratio:1/1;cursor:pointer}
.pth img{width:100%;height:100%;object-fit:cover;display:block}
.pth .cap{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(transparent,rgba(0,0,0,.7));color:#fff;font-size:calc(11px*var(--fs));padding:10px 5px 3px;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pth .ld{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--sub);font-size:12px}
.pgrid:empty{display:none}
.pall-card{display:block;width:100%;text-align:left;color:inherit;font:inherit;cursor:pointer}
.sheet.pall{max-height:92vh;overflow-y:auto}
.pa-day{margin:16px 0 0;font-weight:800;border-bottom:1px solid rgba(127,127,127,.35);padding-bottom:4px}
.linkbtn{background:none;border:0;color:var(--pri);font:inherit;font-weight:700;padding:4px 0;cursor:pointer;white-space:nowrap}
.pby{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.pby button{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:5px 11px;font:inherit;font-size:calc(13px*var(--fs));cursor:pointer;min-height:34px}
.pby button small{color:var(--sub);font-size:.85em}
.pby button.on{background:var(--pri);border-color:var(--pri);color:#fff;font-weight:700}
.pby button.on small{color:#fff;opacity:.85}
.pth,.pth img{-webkit-touch-callout:none;user-select:none;-webkit-user-select:none}
.pth img{pointer-events:none}
.pth .up{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.45);color:#fff;font-size:calc(12px*var(--fs));font-weight:700}
.pth .ck{position:absolute;top:5px;right:5px;width:26px;height:26px;border-radius:50%;border:2px solid #fff;background:rgba(0,0,0,.35);color:#fff;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800}
.pth.sel{outline:3px solid var(--pri);outline-offset:-3px}
.pth.sel .ck{background:var(--pri);border-color:var(--pri)}
.pth.dim{opacity:.35}
.psbar{display:flex;flex-direction:column;align-items:stretch;gap:8px;margin-top:8px;padding:8px 10px;border-radius:12px;background:rgba(76,175,80,.15)}
.psbar b{flex:1;min-width:0}
.sheet.pview{background:#0b0d0c;color:#eee;padding:10px 10px 14px;max-width:760px}
.pview .pv-top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.pview .pv-img{position:relative;display:flex;align-items:center;justify-content:center;min-height:240px;max-height:70vh;background:#000;border-radius:10px;overflow:hidden}
.pview .pv-img img{max-width:100%;max-height:70vh;display:block}
.pview .pv-cap{margin:8px 2px 2px;font-size:calc(16px*var(--fs));font-weight:700}
.pview .btn{background:#1d221f;color:#eee;border-color:#333}
.pview .btn.pri{background:var(--pri);color:#fff;border-color:var(--pri)}
.pview .pv-nav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:64px;border:0;border-radius:10px;background:rgba(0,0,0,.45);color:#fff;font-size:26px}
.scan-thumbs div{position:relative}
.scan-thumbs img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.scan-thumbs span{position:absolute;left:4px;bottom:4px;background:rgba(0,0,0,.65);color:#fff;border-radius:6px;padding:1px 5px;font-size:12px}
.plm-auto{background:var(--auto)!important}
.picker{position:fixed;left:0;right:0;bottom:0;z-index:70;background:var(--card);border-top:3px solid var(--pri);border-radius:18px 18px 0 0;padding:12px 14px calc(14px + env(safe-area-inset-bottom));box-shadow:0 -8px 24px rgba(0,0,0,.3);max-width:720px;margin:0 auto}
.picker .pk-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.picker button.v{min-height:58px;border-radius:12px;border:1px solid var(--line);background:var(--bg);font-size:calc(20px*var(--fs));font-weight:800;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.picker button.v small{font-size:calc(11px*var(--fs));font-weight:600;color:var(--sub);margin-top:2px}
.picker button.v.par{border:2px solid var(--pri)}
.picker button.v.on{background:var(--pri);color:var(--pri-ink);border-color:var(--pri)}
.picker button.v.on small{color:var(--pri-ink)}
.pk-open .sheet,.pk-open .wrap{padding-bottom:55vh}   /* 고르기 창이 떠도 아래 칸까지 올려 볼 수 있게 */
.holes input[readonly]{cursor:pointer;caret-color:transparent}
.holes input.picking{outline:3px solid var(--pri);outline-offset:1px}
.exp.pressing{background:var(--pri-soft);transition:background .4s}
.exp .ck{font-size:22px;margin-right:4px;flex-shrink:0}
.exp.sel{background:var(--bad-soft);border-color:var(--bad)}
.exp.dis{opacity:.5}
.sel-bar{position:sticky;top:0;z-index:15;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;background:var(--card);border:2px solid var(--bad);border-radius:14px;padding:8px 10px;margin-top:8px}
.exp{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.holes .h.sum output{display:flex;align-items:center;justify-content:center;width:100%;height:42px;border-radius:8px;background:var(--pri-soft);color:var(--pri);font-weight:800;font-size:calc(16px*var(--fs))}
.holes .h{display:flex;flex-direction:column;align-items:center}
.holes .h span{font-size:calc(11px*var(--fs));color:var(--sub);line-height:1.3;text-align:center;white-space:nowrap}
.holes .h.sum span{color:var(--pri);font-weight:700}
.holes.rel input{font-size:calc(14px*var(--fs));letter-spacing:-.06em}   /* ± 방식은 '+3'처럼 두 글자라 조금 작게 */
.holes input{width:100%;height:42px;text-align:center;font-size:calc(17px*var(--fs));font-weight:700;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:0}
.tbl{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl tr.first td{font-weight:800}
.winner{text-align:center;padding:20px;border-radius:var(--r);background:linear-gradient(135deg,#f9a825,#ff8f00);color:#2b1d00}
.winner .nm{font-size:calc(30px*var(--fs));font-weight:900}
.save-st{font-size:calc(13px*var(--fs))}

/* 모달 */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:640px;max-height:90vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px 28px}
@media(min-width:720px){.sheet-bg{align-items:center}.sheet{border-radius:20px}}
.sheet h3{margin:0 0 6px}
.cmt{border-top:1px solid var(--line);padding:8px 0;font-size:calc(14px*var(--fs))}

/* 로그인 */
.login{max-width:420px;margin:0 auto;padding:40px 16px}
.names{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.names .btn{min-height:56px;font-size:calc(18px*var(--fs));font-weight:700}
.names .btn.on{background:var(--pri);color:var(--pri-ink);border-color:var(--pri)}
.dots{display:flex;gap:12px;justify-content:center;margin:18px 0}
.dots i{width:18px;height:18px;border-radius:50%;border:2px solid var(--pri);display:block}
.dots i.f{background:var(--pri)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pad button{height:60px;font-size:calc(24px*var(--fs));font-weight:700;border-radius:14px;border:1px solid var(--line);background:var(--card)}

/* 토스트 */
.toast{position:fixed;left:50%;bottom:calc(90px*var(--fs));transform:translateX(-50%);background:#222;color:#fff;border-radius:14px;padding:12px 16px;z-index:60;display:flex;gap:12px;align-items:center;width:max-content;max-width:92vw;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.toast.one span{white-space:nowrap;font-size:min(1em,4.7vw)}
.toast button{background:transparent;border:1px solid #fff;color:#fff;border-radius:10px;padding:6px 10px;white-space:nowrap;flex:none}
.sec-title{font-size:calc(19px*var(--fs));margin:10px 0 2px;padding-bottom:8px;border-bottom:2px solid var(--pri)}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:40;display:grid;grid-template-columns:repeat(5,1fr);background:var(--nav-bg);border-top:3px solid var(--nav-line);padding:4px 4px calc(4px + env(safe-area-inset-bottom));box-shadow:0 -4px 16px rgba(0,0,0,.18)}
.bnav button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:12px;font-size:calc(13px*var(--fs));font-weight:700;color:var(--sub)}
.bnav button .i{font-size:calc(22px*var(--fs));line-height:1}
.mic-fab{position:fixed;right:14px;bottom:90px;z-index:41;width:58px;height:58px;border-radius:50%;border:3px solid #fff;background:#37474f;color:#fff;padding:0;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(0,0,0,.35);cursor:pointer}   /* 앱 초록과 겹치지 않게 진한 남회색 */
.mic-fab svg{display:block;pointer-events:none}
.cam-fab{background:#37474f}
/* 카톡 고르기 창 단추: 제목 한 줄 + 아래 작은 설명 (2026-11-21 글자 뒤섞임 고침) */
.btn.km-opt{display:block;width:100%;white-space:normal;text-align:left;padding:12px 14px;line-height:1.35;font-weight:700}.btn.km-opt .small{display:block;font-weight:400;margin-top:2px}
.kakao-fab{background:#fee500}.kakao-fab svg{width:30px;height:28px}
.mic-fab{touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.mic-fab.fab-drag{transform:scale(1.15);box-shadow:0 10px 26px rgba(0,0,0,.45);opacity:.92}
.fab-set{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:6px}
.fab-set>span{white-space:nowrap;font-size:calc(14px*var(--fs))}
.fab-set .seg-tabs{flex:0 0 55%;margin:0}
.vc-mic{display:block;margin:6px auto 4px;width:84px;height:84px;border-radius:50%;border:0;background:var(--pri);color:#fff;font-size:40px;box-shadow:0 4px 14px rgba(0,0,0,.25);cursor:pointer}
.vc-mic.on{background:#d32f2f;animation:vcpulse 1.2s ease-in-out infinite}
.vc-mic.off{background:var(--line);color:var(--sub)}
@keyframes vcpulse{50%{box-shadow:0 0 0 12px rgba(211,47,47,.25)}}
@media (prefers-reduced-motion:reduce){.vc-mic.on{animation:none}}
.vc-st{text-align:center;font-size:calc(14px*var(--fs));color:var(--sub);min-height:1.4em}
.vc-said{text-align:center;font-weight:800;font-size:calc(17px*var(--fs));margin:6px 0;min-height:1.3em}
.vc-card{border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:8px;background:var(--bg)}
.vc-big{font-size:calc(22px*var(--fs));margin:8px 0 10px}
.vc-ans{font-size:calc(17px*var(--fs));font-weight:700;line-height:1.5}
.vc-cam{display:block;width:100%;margin-top:10px;padding:16px 0;font-size:calc(18px*var(--fs));text-align:center}

/* 💱 환율 흐름 그래프 (2026-11-20): 유럽중앙은행 기준 하루 한 번 값(frankfurter). 1달·3달·1년, 손가락을 대면 그날 환율. 점선 = 정산 환율 */

/* 🕐 '언제 했는지' 시각(댓글·마지막 수정·기본값 저장·변경기록 등)은 서버가 태국 시각으로 적음 → 폰이 있는 곳 시각으로 보여 줌 (2026-11-21 사용자 요청)
   일정 시각(04:00 출발 등)은 그 장소 시각 그대로. 태국에 가서 폰 시각이 태국으로 바뀌면 그대로 보임 */
function atLocal(at, short) {
  var m = /^(\d{4})-(\d{2})-(\d{2}) (\d{2}):(\d{2})/.exec(String(at || '')); if (!m) return String(at || '');
  var kOff = 9 + Number((S.D && S.D.settings && S.D.settings.tz_offset_from_korea) || -2);   // 태국 = 한국 -2 = UTC+7
  var t = Date.UTC(+m[1], +m[2] - 1, +m[3], +m[4], +m[5]) - kOff * 3600e3, d = new Date(t), p2 = function (x) { return ('0' + x).slice(-2); };
  var out = d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-' + p2(d.getDate()) + ' ' + p2(d.getHours()) + ':' + p2(d.getMinutes());
  return short ? out.slice(5) : out;
}

function segHtml(its, i) {
  var a = null;
  for (var k = i - 1; k >= 0; k--) if (hasLL(its[k])) { a = its[k]; break; }
  var b = its[i];
  if (!a || !hasLL(b)) return '';
  if (Math.abs(a.lat - b.lat) < 1e-4 && Math.abs(a.lng - b.lng) < 1e-4) return '';
  if (haversine(a, b) > 300) return '';
  var key = ll(a) + '>' + ll(b), r = S.routes[key];
  var prev = its[i - 1];
  var txt, late = false, slack = null;
  if (r) {
    txt = '🚗 ' + (r.km < 10 ? r.km.toFixed(1) : Math.round(r.km)) + 'km · 약 ' + durText(r.min);
    if (prev.time && b.time) {

      if (prev === a && slack < r.min) late = true;
    }
  } else {

    fetchRoute(a, b);
  }
  return '<li class="seg' + (late ? ' late' : '') + '"><span>' + txt + '</span>' +
    '<a class="live" target="_blank" href="' + esc(gmapDir(a, b)) + '">🚦 실시간 확인하기</a>' +
    (late ? '<span>⚠️ 이동 ' + durText(r.min) + ' 필요, 여유 ' + durText(Math.max(0, slack)) + '</span>' +
      (S.me.isAdmin && !b.fixed ? ' <button class="btn sm" data-shift="' + esc(b.id) + '" data-min="' + Math.ceil((r.min - slack) / 5) * 5 + '">⏩ 뒤 일정 ' + Math.ceil((r.min - slack) / 5) * 5 + '분 미루기</button>' : '') +
      (S.me.isAdmin && !prev.fixed && prev.time ? ' <button class="btn sm" data-pull="' + esc(prev.id) + '" data-min="' + Math.ceil((r.min - slack) / 5) * 5 + '">⏪ 앞 일정 ' + Math.ceil((r.min - slack) / 5) * 5 + '분 당기기</button>' : '') : '') +
    '</li>';

var routeBusy = {};
function fetchRoute(a, b) {
  var key = ll(a) + '>' + ll(b);

  routeBusy[key] = 1;
  fetch('https://router.project-osrm.org/route/v1/driving/' + a.lng + ',' + a.lat + ';' + b.lng + ',' + b.lat + '?overview=false')
    .then(function (r) { return r.json(); })
    .then(function (j) {
      if (!j.routes || !j.routes[0]) throw new Error('no route');
      S.routes[key] = { km: j.routes[0].distance / 1000, min: Math.max(1, Math.round(j.routes[0].duration / 60)) };
      LS.set('trip_routes', S.routes);
      if (S.tab && /^\d{4}-/.test(S.tab) && !el('.sheet-bg') && !dragState) renderMain();
    })

      S.routes[key] = { km: km, min: Math.round(km / 40 * 60), approx: true };

/* ═════════ 경비 · 정산 · 회비 (2차본) ═════════ */
var CATS = [['식사', '🍽️'], ['술·음료', '🍺'], ['마사지', '💆'], ['교통', '🚕'], ['팁', '💵'], ['골프', '⛳'], ['쇼핑', '🛍️'], ['기타', '⭐']];
function catIcon(c) { for (var i = 0; i < CATS.length; i++) if (CATS[i][0] === c) return CATS[i][1]; return '⭐'; }
function won(n) { return num(Math.round(n)) + '원'; }
function baht(n) { var v = Math.round(Number(n) * 100) / 100; return '฿' + num(v); }
function wonShort(n) { n = Math.round(n); if (Math.abs(n) >= 10000) return (Math.round(n / 1000) / 10) + '만원'; return num(n) + '원'; }
function memberNames() { return S.D.members.map(function (m) { return m.name; }); }
function settleRate() { return Number(S.D.settings.settle_rate || S.D.settings.fallback_rate || 41.65); }
function liveRate() { return (S.fx && S.fx.rate) || settleRate(); }
function expenses() { return (S.D.expenses || []).slice().sort(function (a, b) { return a.date < b.date ? 1 : a.date > b.date ? -1 : (a.updated_at < b.updated_at ? 1 : -1); }); }
function partsOf(e) { var p = String(e.participants || '').split(',').filter(Boolean); return p.length ? p : memberNames(); }

/* 공금 보관자 [{name, start}] — 설정 common_cash_note의 "이름 숫자바트"를 읽음 (회원 이름만) */
function cashHolders() {
  var note = String(S.D.settings.common_cash_note || ''), names = memberNames(), out = [], m, re = /([가-힣A-Za-z]+)\s*฿?\s*([\d,]+)\s*(?:바트|฿|THB)?/g;
  while ((m = re.exec(note))) { if (names.indexOf(m[1]) >= 0) out.push({ name: m[1], start: Number(m[2].replace(/,/g, '')) || 0 }); }
  // 공금을 넘겨받은 사람도 보관자가 됨 (처음 금액 0)
  (S.D.cashMoves || []).forEach(function (mv) { if (names.indexOf(mv.to) >= 0 && !out.some(function (h) { return h.name === mv.to; })) out.push({ name: mv.to, start: 0 }); });
  return out;
}
/* 현지 추가 환전 기록 (공금이동 중 from='회비') */
function exchanges() { return (S.D.cashMoves || []).filter(function (m) { return m.from === '회비'; }); }
function sumOf(list, k) { return list.reduce(function (a, x) { return a + (Number(String(x[k] || '').replace(/,/g, '')) || 0); }, 0); }
/* 사람별 남은 공금: 처음 맡은 돈 − 그 사람 지갑에서 낸 공금. 지갑을 안 고른 공금은 따로 */
function cashByHolder() {
  var hs = cashHolders(), used = {}, none = 0;
  hs.forEach(function (h) { used[h.name] = 0; });
  (S.D.expenses || []).forEach(function (e) {
    if (e.payer !== '공금') return;
    var t = Number(e.thb) || 0;
    if (e.cash_from && used[e.cash_from] !== undefined) used[e.cash_from] += t; else none += t;
  });
  var moved = {}; hs.forEach(function (h) { moved[h.name] = 0; });
  (S.D.cashMoves || []).forEach(function (mv) {
    var t = Number(String(mv.thb).replace(/,/g, '')) || 0;
    if (moved[mv.from] !== undefined) moved[mv.from] -= t;
    if (moved[mv.to] !== undefined) moved[mv.to] += t;
  });
  return { list: hs.map(function (h) { return { name: h.name, start: h.start, used: used[h.name], moved: moved[h.name], left: h.start + moved[h.name] - used[h.name] }; }), none: none };
}

/* 정산 계산 (바트 기준) */
function calcSettle() {
  var names = memberNames(), paid = {}, owed = {}, enjoyed = {}, support = {};
  names.forEach(function (n) { paid[n] = 0; owed[n] = 0; enjoyed[n] = 0; support[n] = 0; });
  var total = 0, common = 0, bank = 0, personalShared = 0, supportTotal = 0, byCat = {}, byDay = {};
  (S.D.expenses || []).forEach(function (e) {
    var thb = Number(e.thb) || 0, sup = e.kind === '지원' ? thb : e.kind === '일부지원' ? Number(e.support_thb) || 0 : 0;
    var shared = thb - sup, parts = partsOf(e);
    total += thb; byCat[e.category] = (byCat[e.category] || 0) + thb; byDay[e.date] = (byDay[e.date] || 0) + thb;
    parts.forEach(function (n) { if (enjoyed[n] !== undefined) enjoyed[n] += thb / parts.length; });
    if (e.payer === '공금') { common += thb; return; }
    if (e.payer === '통장') { bank += thb; return; }   // 회비 통장에서 낸 돈: 정산에서 빠짐, 바트 현금은 안 줄어듦
    if (sup) { support[e.payer] = (support[e.payer] || 0) + sup; supportTotal += sup; }
    if (shared > 0) {
      personalShared += shared;
      paid[e.payer] = (paid[e.payer] || 0) + shared;
      parts.forEach(function (n) { if (owed[n] !== undefined) owed[n] += shared / parts.length; });
    }
  });
  var rate = settleRate(), bal = {};
  names.forEach(function (n) { bal[n] = paid[n] - owed[n]; });
  // 최소 송금 (원, 100원 단위)
  var cred = [], debt = [];
  names.forEach(function (n) { var w = Math.round(bal[n] * rate / 100) * 100; if (w > 0) cred.push({ n: n, a: w }); else if (w < 0) debt.push({ n: n, a: -w }); });
  cred.sort(function (a, b) { return b.a - a.a; }); debt.sort(function (a, b) { return b.a - a.a; });
  var transfers = [], i = 0, j = 0;
  while (i < debt.length && j < cred.length) {
    var x = Math.min(debt[i].a, cred[j].a);
    if (x >= 100) transfers.push({ from: debt[i].n, to: cred[j].n, krw: x });
    debt[i].a -= x; cred[j].a -= x;
    if (debt[i].a < 100) i++; if (cred[j].a < 100) j++;
  }
  // 회원별 받을(+)/보낼(−) 원 = 송금 목록에서 받는 돈 − 보내는 돈 (100원 반올림 차이가 송금 목록과 어긋나지 않게)
  var net = {}; names.forEach(function (n) { net[n] = 0; });
  transfers.forEach(function (t) { net[t.from] -= t.krw; net[t.to] += t.krw; });
  var cash0 = Number(S.D.settings.common_cash_thb || 0), exThb = sumOf(exchanges(), 'thb'), cash = cash0 + exThb;
  return { names: names, paid: paid, owed: owed, bal: bal, enjoyed: enjoyed, support: support, total: total, common: common, cashLeft: cash - common, cash: cash, cash0: cash0, exThb: exThb, net: net,
    personalShared: personalShared, supportTotal: supportTotal, bank: bank, byCat: byCat, byDay: byDay, transfers: transfers, rate: rate };
}
/* 정산 표시: 누를 때의 금액(stamp)과 지금 금액이 같아야 ✓. 지출이 바뀌어 금액이 달라지면 stale(다시 눌러야 함) */
function settleRow(key, who) { return (S.D.settle || []).filter(function (r) { return r.key === key && r.member === (who || ''); })[0]; }
function settleOn(key, who, stamp) { var r = settleRow(key, who); return !!r && r.value === 'Y' + (stamp ? ':' + stamp : ''); }
function settleStale(key, who, stamp) { var r = settleRow(key, who); return !!r && /^Y/.test(r.value) && !settleOn(key, who, stamp); }
/* 정산 내용 요약 (확인 버튼용): 송금 목록이 같으면 같은 값 */
function settleSig(c) {
  var t = c.transfers.map(function (x) { return x.from + '>' + x.to + ':' + x.krw; }).join('|') + '#' + Math.round(c.total), h = 5381;
  for (var i = 0; i < t.length; i++) h = ((h * 33) ^ t.charCodeAt(i)) >>> 0;
  return h.toString(36);
}

function viewMoney() {

  var w = cashByHolder();
  if (!w.list.length) return S.D.settings.common_cash_note ? '<div class="wsub">' + esc(S.D.settings.common_cash_note) + '</div>' : '';
  return '<div class="wsub">👛 이 돈을 누가 갖고 있나요</div>' + w.list.map(function (h) {
    return '<div class="wrow"><span>' + esc(h.name) + (h.start && h.start !== h.left ? ' <span class="small muted">처음 ' + baht(h.start) + '</span>' : '') + '</span><b>' + baht(h.left) + '</b></div>';
  }).join('') +
    (w.none ? '<div class="wrow"><span class="small" style="color:var(--warn)">지갑을 안 고른 지출 (눌러서 "누구 지갑"을 골라 주세요)</span><b style="color:var(--warn)">−' + baht(w.none) + '</b></div>' : '') +
    movesHtml();
}
/* 공금 넘겨준 기록 + [🔁 공금 넘겨주기] 버튼 */
function movesHtml() {
  var mv = (S.D.cashMoves || []).slice().sort(function (a, b) { return a.date < b.date ? -1 : 1; });
  return '<div class="row wrap-row" style="margin-top:6px"><button class="btn sm" data-act="cash-move">🔁 공금 넘겨주기</button><button class="btn sm" data-act="cash-exch">💱 추가 환전</button></div>' +
    mv.map(function (m) {
      var canDel = m.by === S.me.name || S.me.isAdmin, ex = m.from === '회비';
      return '<div class="small" style="margin-top:4px">' + (ex ? '💱 ' + md(m.date) + ' 회비 환전 → ' + esc(m.to) + ' <b>' + baht(m.thb) + '</b> <span class="muted">(' + won(m.krw) + ')</span>'
        : '🔁 ' + md(m.date) + ' ' + esc(m.from) + ' → ' + esc(m.to) + ' <b>' + baht(m.thb) + '</b>') + (m.memo ? ' <span class="muted">' + esc(m.memo) + '</span>' : '') +
        (canDel ? ' <a href="#" data-mvdel="' + esc(m.id) + '">✕</a>' : '') + '</div>';

}
/* 💱 추가 환전: 회비 통장 원화를 현지에서 바트로 바꿈 → 받은 사람 지갑 +바트, 회비 사용 +원화 */

  var names = memberNames(), today = localNow().date, ds = dates(), rate = liveRate();
  var hs = cashHolders().map(function (h) { return h.name; });

  var sh = sheet('<h3>💱 공금 추가 환전</h3><p class="small muted">회비 통장 돈을 현지에서 바트로 더 바꿨을 때 적어 주세요. 바트는 받은 사람 지갑(공금)에 더해지고, 원화는 회비 사용으로 빠집니다.</p>' +
    '<label class="lb">바꾼 바트를 받은 사람</label><div class="grid4" id="ex-to">' + names.map(function (n) { return '<button class="pick' + (n === st.to ? ' on' : '') + '" data-v="' + esc(n) + '">' + esc(n) + '</button>'; }).join('') + '</div>' +
    '<div class="fx-grid x-money" style="margin-top:10px"><label class="mwrap"><span class="unit">THB</span><input class="inp money" id="ex-thb" inputmode="decimal" placeholder="0"></label><span>⇄</span><label class="mwrap won"><span class="unit">원</span><input class="inp money" id="ex-krw" inputmode="numeric" placeholder="0"></label></div>' +
    '<p class="small muted" style="margin:4px 2px 0">원화는 지금 환율(' + rate.toFixed(2) + '원)로 먼저 채워져요. 실제로 통장에서 나간 금액으로 고쳐 주세요.</p>' +
    '<div class="row" style="margin-top:8px"><label class="lb" style="margin:0">날짜</label><select class="inp" id="ex-date" style="flex:1">' + ds.map(function (d) { return '<option value="' + d + '"' + (d === (ds.indexOf(today) >= 0 ? today : ds[0]) ? ' selected' : '') + '>' + md(d) + '(' + wd(d) + ')</option>'; }).join('') + '</select></div>' +
    '<label class="lb">메모 (선택)</label><input class="inp" id="ex-memo" placeholder="예) 공항 환전소, ATM">' +
    '<p class="small" id="ex-msg" style="color:var(--bad);min-height:18px"></p>' +
    '<div class="row" style="justify-content:flex-end"><button class="btn" data-close>취소</button><button class="btn pri" id="ex-ok">저장</button></div>');
  els('#ex-to .pick', sh).forEach(function (b) { b.onclick = function () { st.to = b.dataset.v; els('#ex-to .pick', sh).forEach(function (x) { x.classList.toggle('on', x === b); }); }; });
  var tIn = el('#ex-thb', sh), kIn = el('#ex-krw', sh), kTouched = false;
  tIn.oninput = function () { commaLive(tIn, true); if (kTouched) return; var v = parseFloat(tIn.value.replace(/,/g, '')); kIn.value = isFinite(v) ? num(Math.round(v * rate)) : ''; };
  kIn.oninput = function () { commaLive(kIn, false); kTouched = !!kIn.value; };
  el('#ex-ok', sh).onclick = function () {
    var thb = tIn.value.replace(/,/g, ''), krw = kIn.value.replace(/,/g, '');
    if (!st.to) { el('#ex-msg', sh).textContent = '바트를 받은 사람을 골라 주세요.'; return; }
    if (!(Number(thb) > 0)) { el('#ex-msg', sh).textContent = '받은 바트를 적어 주세요.'; return; }
    if (!(Number(krw) > 0)) { el('#ex-msg', sh).textContent = '통장에서 나간 원화를 적어 주세요.'; return; }
    call('addCashMove', { from: '회비', to: st.to, thb: thb, krw: krw, date: el('#ex-date', sh).value, memo: el('#ex-memo', sh).value }).then(function (r) {
      S.D.cashMoves = r.cashMoves; saveCache(); closeSheet(); renderMain(); toast(st.to + ' 지갑에 ' + baht(thb) + ' 더했습니다.');
    }).catch(function (e) { el('#ex-msg', sh).textContent = e.message; });

function cashMoveForm() {
  var hs = cashByHolder().list, names = memberNames(), today = localNow().date, ds = dates();

    '<label class="lb">주는 사람</label><div class="grid4" id="mv-from">' + hs.map(function (h) { return '<button class="pick' + (h.name === st.from ? ' on' : '') + '" data-v="' + esc(h.name) + '">' + esc(h.name) + '<br><span class="small">' + baht(h.left) + '</span></button>'; }).join('') + '</div>' +
    '<label class="lb">받는 사람</label><div class="grid4" id="mv-to">' + names.map(function (n) { return '<button class="pick" data-v="' + esc(n) + '">' + esc(n) + '</button>'; }).join('') + '</div>' +

/* 지출 고르기 모드: 꾹 누르면 시작, 눌러서 여러 개 고르고 한꺼번에 삭제 */
function canDelExp(e) { return e.created_by === S.me.name || S.me.isAdmin; }
function viewExpenseList() {
  var list = expenses(), sel = S.expSel;
  var html = sel
    ? '<div class="sel-bar"><b>☑️ ' + sel.length + '개 골랐어요</b><div class="row"><button class="btn sm" data-act="exp-sel-all">전체</button>' +
      '<button class="btn sm bad" data-act="exp-sel-del"' + (sel.length ? '' : ' disabled') + '>🗑️ 삭제</button><button class="btn sm" data-act="exp-sel-x">취소</button></div></div>' +
      '<p class="small muted" style="margin:4px 2px 0">지울 항목을 눌러서 고르세요. ' + (S.me.isAdmin ? '' : '내가 적은 지출만 고를 수 있습니다.') + '</p>'
    : '<button class="btn pri big-btn" data-act="exp-add">＋ 지출 적기</button>';
  if (!list.length) return html + '<p class="muted" style="text-align:center;margin:20px 0">아직 적은 지출이 없습니다.</p>';
  var day = '';
  list.forEach(function (e) {

    var on = sel && sel.indexOf(e.id) >= 0, dis = sel && !canDelExp(e);
    html += '<div class="exp' + (on ? ' sel' : '') + (dis ? ' dis' : '') + '" data-exp="' + esc(e.id) + '">' + (sel ? '<div class="ck">' + (on ? '✅' : dis ? '🔒' : '⬜') + '</div>' : '') + '<div class="ic">' + catIcon(e.category) + '</div>' +
      '<div class="body"><div class="ttl">' + esc(e.title || e.category) + (e.receipt_id ? ' 🧾' : '') + '</div>' +
      '<div class="small muted">' + (e.payer === '공금' ? '💰 공금' + (e.cash_from ? '(' + esc(e.cash_from) + ')' : '') : e.payer === '통장' ? '🏦 회비 통장' : '👤 ' + esc(e.payer)) + ' · ' + (e.kind === '지원' ? '정산 제외' : partsOf(e).length + '명') + '</div>' + kindChip + '</div>' +
      '<div class="amt"><b>' + baht(e.thb) + '</b><div class="small muted">' + won(e.krw || e.thb * settleRate()) + '</div></div></div>';
  });
  return html;
}

function viewSettle(c) {
  var names = c.names, sig = settleSig(c), confirmed = names.filter(function (n) { return settleOn('confirm', n, sig); });
  var allOk = confirmed.length === names.length;
  var maxCat = Math.max.apply(null, Object.keys(c.byCat).map(function (k) { return c.byCat[k]; }).concat([1]));
  var html =
    '<p class="small muted" style="margin:0 2px 6px">현지에서 쓴 돈(지출 기록)만 계산합니다. 회비 통장 돈은 들어가지 않아요.</p>' +
    // 현지 총 지출 = 공금 사용 + 회원이 낸 공동경비 + 지원(쏨)  — 세 칸을 더하면 늘 총 지출과 같음
    '<div class="eqn"><div class="eq-total"><span class="lab">현지 총 지출</span><b>' + baht(c.total) + '</b><span class="small muted">' + wonShort(c.total * c.rate) + '</span></div>' +
      '<div class="eq-row">' +
        '<div class="eq-part"><span class="lab">' + (c.bank ? '공금·통장' : '공금 사용') + '</span><b>' + baht(c.common + c.bank) + '</b><span class="small muted">' + (c.bank ? '통장 ' + baht(c.bank) : wonShort(c.common * c.rate)) + '</span></div><span class="eq-op">+</span>' +
        '<div class="eq-part"><span class="lab">회원이 낸<br>공동경비</span><b>' + baht(c.personalShared) + '</b><span class="small muted">' + wonShort(c.personalShared * c.rate) + '</span></div><span class="eq-op">+</span>' +
        '<div class="eq-part"><span class="lab">지원(쏨)</span><b>' + baht(c.supportTotal) + '</b><span class="small muted">' + wonShort(c.supportTotal * c.rate) + '</span></div></div></div>' +
    '<div class="row between" style="margin:6px 2px 0;flex-wrap:wrap"><span>정산 환율 <b>฿1 = ' + c.rate + '원</b></span>' + (S.me.isAdmin ? '<button class="btn sm" data-act="settle-rate">✏️ 환율 바꾸기</button>' : '') + '</div>' +
    '<p class="small muted">회원끼리 주고받을 돈은 <b>각자 카드·현금으로 낸 공동경비</b>만 계산합니다. 공금으로 낸 돈은 이미 다 같이 낸 돈이라 빠집니다.</p>' + repayCard(c);

  // 송금 안내
  html += '<div class="card"><b>💸 이렇게 보내면 끝</b>';
  if (!c.transfers.length) html += '<p class="muted">주고받을 돈이 없습니다. 👍</p>';
  c.transfers.forEach(function (t) {
    var k = t.from + '>' + t.to, amt = String(t.krw), sent = settleOn('sent:' + k, '', amt), recv = settleOn('recv:' + k, '', amt);
    var stale = settleStale('sent:' + k, '', amt) || settleStale('recv:' + k, '', amt);
    html += '<div class="tr"><div class="who"><b>' + esc(t.from) + '</b> → <b>' + esc(t.to) + '</b></div><div class="amt-big">' + won(t.krw) + '</div>' +
      (stale ? '<p class="small" style="color:var(--warn);margin:0 0 6px">⚠️ 표시한 뒤에 금액이 바뀌었어요. 차액을 주고받고 다시 눌러 주세요.</p>' : '') +
      '<div class="row wrap-row">' +
        (t.from === S.me.name || S.me.isAdmin ? '<button class="btn sm' + (sent ? ' pri' : '') + '" data-mark="sent:' + esc(k) + '" data-stamp="' + amt + '" data-on="' + (sent ? '' : '1') + '">' + (sent ? '✓ 보냈어요' : '보냈어요') + '</button>' : '<span class="chip' + (sent ? '' : ' warn') + '">' + (sent ? '✓ 보냄' : '보내기 전') + '</span>') +
        (t.to === S.me.name || S.me.isAdmin ? '<button class="btn sm' + (recv ? ' pri' : '') + '" data-mark="recv:' + esc(k) + '" data-stamp="' + amt + '" data-on="' + (recv ? '' : '1') + '">' + (recv ? '✓ 받았어요' : '받았어요') + '</button>' : '<span class="chip' + (recv ? '' : ' warn') + '">' + (recv ? '✓ 받음' : '받기 전') + '</span>') +
      '</div></div>';
  });
  var allDone = c.transfers.length && c.transfers.every(function (t) { return settleOn('recv:' + t.from + '>' + t.to, '', String(t.krw)); });
  // 전에 '보냈어요/받았어요'를 눌렀는데, 지출이 바뀌어 지금 송금 목록에서 빠진 것
  var nowPairs = c.transfers.map(function (t) { return t.from + '>' + t.to; }), gone = {};
  (S.D.settle || []).forEach(function (r) {
    var m = /^(sent|recv):(.+>.+)$/.exec(r.key);
    if (!m || !/^Y/.test(r.value) || nowPairs.indexOf(m[2]) >= 0) return;
    var g = gone[m[2]] = gone[m[2]] || { amt: '', what: [] };
    g.what.push(m[1] === 'sent' ? '보냈어요' : '받았어요'); if (r.value.indexOf('Y:') === 0) g.amt = r.value.slice(2);
  });
  Object.keys(gone).forEach(function (k) {
    var g = gone[k];
    html += '<p class="small" style="color:var(--warn);margin:8px 0 0">⚠️ 전에 <b>' + esc(k.replace('>', ' → ')) + '</b>' + (g.amt ? ' ' + won(Number(g.amt)) : '') + '을 "' + g.what.join('·') + '"로 표시했지만, 지출이 바뀌어 지금 계산에는 없어요. 이미 주고받은 돈이면 서로 돌려주거나 관리자와 맞춰 주세요.</p>';
  });
  if (allDone) html += '<p class="chip" style="margin-top:8px">🎉 송금이 모두 끝났습니다. 정산 종료!</p>';
  html += shareRow('settle', '정산 결과 · 누가 누구에게') + '</div>';

  // 회원별
  html += '<div class="card"><b>👥 회원별</b><p class="small muted" style="margin:4px 0 0">받을·보낼 돈 = <b>내가 낸 공동경비</b> − <b>나눠 낼 몫</b>(공동경비를 함께한 사람 수로 나눈 내 몫)</p>';
  names.forEach(function (n) {
    var b = c.net[n], cls = b > 0 ? 'good' : b < 0 ? 'bad' : '';
    html += '<div class="mrow"><div><b>' + esc(n) + '</b>' + (settleOn('confirm', n, sig) ? ' <span class="chip">✓ 확인</span>' : '') +
      '<div class="small muted">내가 낸 공동경비 ' + baht(c.paid[n]) + '<br>− 나눠 낼 몫 ' + baht(c.owed[n]) + ' = <b>' + (c.paid[n] - c.owed[n] >= 0 ? '+' : '−') + baht(Math.abs(Math.round((c.paid[n] - c.owed[n]) * 100) / 100)) + '</b></div>' +
      '<div class="small muted">(참고) 공금·지원까지 합친 내 몫 ' + baht(Math.round(c.enjoyed[n])) + ' (약 ' + wonShort(c.enjoyed[n] * c.rate) + ')</div></div>' +
      '<div class="bal ' + cls + '">' + (!b ? '0원' : (b > 0 ? '받을 돈<br>' : '보낼 돈<br>') + won(Math.abs(b))) + '</div></div>';
  });
  html += '</div>';

  // 지원 감사 보드
  var sups = (S.D.expenses || []).filter(function (e) { return e.kind !== '공동' && e.payer !== '공금' && e.payer !== '통장'; });
  html += '<div class="card thanks"><b>🙏 지원 감사 보드</b>' + (sups.length ? '' : '<p class="small muted">아직 지원 기록이 없습니다.</p>');
  names.forEach(function (n) {
    if (!c.support[n]) return;
    html += '<div class="mrow"><div><b>' + esc(n) + '</b> 님 <span class="small muted">덕분에 잘 먹고 잘 놀았습니다!</span><div class="small">' +
      sups.filter(function (e) { return e.payer === n; }).map(function (e) { return md(e.date) + ' ' + esc(e.title || e.category) + ' ' + baht(e.kind === '지원' ? e.thb : e.support_thb); }).join(' · ') +
      '</div></div><div class="bal good">' + baht(c.support[n]) + '<br><span class="small">' + wonShort(c.support[n] * c.rate) + '</span></div></div>';
  });
  html += '</div>';

  // 항목별 · 날짜별
  html += '<div class="card"><b>📊 어디에 썼나</b>' + Object.keys(c.byCat).sort(function (a, b) { return c.byCat[b] - c.byCat[a]; }).map(function (k) {

    (allOk ? '<p class="chip" style="margin-top:8px">🎉 4명 모두 확인 — 정산 확정</p>' : '') + '</div>' +

}

/* 회비 납부 현황 */
function feeStats() {
  var s = S.D.settings, names = memberNames();
  var fees = S.D.fees || [], uses = S.D.feeUses || [];
  var paidBy = {}; names.forEach(function (n) { paidBy[n] = 0; });
  fees.forEach(function (f) { paidBy[f.member] = (paidBy[f.member] || 0) + Number(f.amount || 0); });
  var paidTotal = names.reduce(function (a, n) { return a + paidBy[n]; }, 0);
  exchanges().forEach(function (m) { uses = uses.concat([{ title: '💱 현지 환전 ' + baht(m.thb), date: m.date, by: m.to, memo: m.memo, amount: m.krw, ex: true }]); });
  var useTotal = uses.reduce(function (a, u) { return a + Number(String(u.amount || 0).replace(/,/g, '')); }, 0);
  var interest = Number(s.fee_interest || 0);
  return { names: names, fees: fees, uses: uses, paidBy: paidBy, paidTotal: paidTotal, useTotal: useTotal, interest: interest, balance: paidTotal + interest - useTotal };
}
function viewFee() {
  var s = S.D.settings, target = Number(s.fee_target || 0), F = feeStats(), names = F.names;
  var fees = F.fees, uses = F.uses, paidBy = F.paidBy, paidTotal = F.paidTotal, useTotal = F.useTotal;

      }).join('') : '<p class="muted small">아직 사용 기록이 없습니다.</p>') +

  } else {
    html += '<div class="card"><b>🏦 통장 잔고</b>' + (asof ? ' <span class="small muted">(' + esc(s.fee_asof) + ' 기준)</span>' : '') +

      '<div class="kv"><span>총 납부</span><b>' + won(paidTotal) + '</b></div>' +

      '<div class="kv"><span>사용</span><b>−' + won(useTotal) + '</b></div>' +
      '<div class="kv" style="font-size:calc(17px*var(--fs))"><span><b>통장 잔고</b></span><b style="color:var(--pri)">' + won(balance) + '</b></div>' +
      unpaidRows + '</div>' +
      (S.me.isAdmin ? '<button class="btn sm" data-act="fee-bank" style="margin-top:8px">🏦 통장 잔고 맞추기 (관리자)</button>' : '') +
      '<p class="small muted" style="margin-top:8px">환전한 바트(공금)는 여행에서 쓰고, 남은 공금은 돌아와서 회비로 다시 넣으면 됩니다.</p></div>';
  }
  return html;
}

  els('#x-parts .pick', sh).forEach(function (b) {

  function sync() {

      : st.kind === '지원' ? '기록만 남고 정산에서는 빠집니다. 감사 보드에 이름이 올라갑니다. 🙏'
      : '지원한 금액만 빼고 나머지를 함께한 사람끼리 나눕니다.';
    el('#x-sup-box', sh).style.display = !cash && st.kind === '일부지원' ? '' : 'none';
    el('#x-parts-box', sh).style.display = cash || st.kind === '지원' ? 'none' : '';
  }
  sync();
  if (st.receipt) showReceipt(st.receipt, el('#x-rimg', sh), 'thumb');
  function onPick(inp) {
    inp.onchange = function () {

      el('#x-rst', sh).textContent = '사진 줄이는 중…';

      shrinkImage(f, 1600, 0.8).then(function (dataUrl) {
        shot = dataUrl;
        el('#x-rimg', sh).innerHTML = '<img class="rimg" src="' + dataUrl + '">';
        el('#x-rst', sh).textContent = '영수증 올리는 중…';

        call('uploadReceipt', { dataUrl: dataUrl }).then(function (r) {
          st.receipt = r.id; saved = true;
          if (!done) el('#x-rst', sh).textContent = '✓ 영수증 저장됨 · 금액 읽는 중… ' + Math.round((Date.now() - t0) / 1000) + '초';
        }).catch(function (err) { el('#x-rst', sh).textContent = '영수증 저장 실패: ' + err.message; });
        // 금액 읽기는 60초까지만 기다림 (지난 초를 보여 줌)
        var t0 = Date.now();
        var tick = setInterval(function () {
          if (done) return clearInterval(tick);
          el('#x-rst', sh).textContent = (saved ? '✓ 영수증 저장됨 · ' : '영수증 올리는 중 · ') + '금액 읽는 중… ' + Math.round((Date.now() - t0) / 1000) + '초';
        }, 1000);
        var timer = setTimeout(function () {
          if (done) return; done = true;
          el('#x-rst', sh).textContent = (saved ? '✓ 영수증 저장됨 · ' : '') + '금액 읽기가 오래 걸려 멈췄습니다. 금액은 직접 적어 주세요.';
        }, 60000);
        // 금액 읽기는 더 작은 사진(긴 쪽 1024px)으로 보내 빠르게
        return shrinkImage(f, 1024, 0.7).then(function (small) { return call('recognize', { kind: 'receipt', dataUrl: small }); }).then(function (r) {
          if (done) return; done = true; clearTimeout(timer);
          applyReceipt(r.result || {});
        }, function (e) {
          if (done) return; done = true; clearTimeout(timer);
          el('#x-rst', sh).textContent = (saved ? '✓ 영수증 저장됨 · ' : '') + (e.message === 'NO_KEY' ? '자동 인식은 아직 설정 전' : '금액은 직접 적어 주세요 (' + e.message + ')');
        });
      }).catch(function (err) { el('#x-rst', sh).textContent = '영수증 저장 실패: ' + err.message; });
    };
  }
  /* 영수증에서 읽은 값을 노란 칸으로 채움 → 사람이 확인 후 저장 */
  function applyReceipt(r) {
    var filled = [];
    var total = Number(r.total);
    if (total > 0) {
      if (r.currency === 'KRW') { kIn.value = num(Math.round(total)); kIn.oninput(); kIn.classList.add('auto'); }
      else { tIn.value = Math.round(total * 100) / 100; tIn.oninput(); tIn.classList.add('auto'); }
      filled.push('금액');

    if (r.store && !el('#x-title', sh).value) { el('#x-title', sh).value = r.store; el('#x-title', sh).classList.add('auto'); filled.push('가게'); }
    if (r.category && CATS.some(function (c) { return c[0] === r.category; })) {

function downloadCsv() {
  var rows = [['날짜', '항목', '내용', '바트', '원', '입력 환율', '낸 사람', '종류', '지원 금액(바트)', '함께한 사람', '메모', '영수증', '적은 사람']];
  expenses().slice().reverse().forEach(function (e) {
    rows.push([e.date, e.category, e.title, e.thb, e.krw, e.rate, e.payer, e.kind, e.support_thb, partsOf(e).join(' '), e.memo, e.receipt_id ? '있음' : '', e.created_by]);
  });
  var csv = '﻿' + rows.map(function (r) { return r.map(function (v) { v = String(v === undefined ? '' : v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }).join(','); }).join('\r\n');
  var a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  a.download = '태국여행_지출_' + localNow().date + '.csv';
  document.body.appendChild(a); a.click(); setTimeout(function () { a.remove(); }, 1000);
}

/* 환전 평균 환율: 회비 사용 중 '환전 ฿00,000' 기록 + 현지 추가 환전 → 원 합 ÷ 바트 합 */
function exchAvgRate() {
  var thb = 0, krw = 0;
  (S.D.feeUses || []).forEach(function (u) { var m = /환전\s*฿?\s*([\d,]+)/.exec(u.title || ''); if (m) { thb += Number(m[1].replace(/,/g, '')) || 0; krw += Number(String(u.amount).replace(/,/g, '')) || 0; } });
  exchanges().forEach(function (m) { thb += Number(String(m.thb).replace(/,/g, '')) || 0; krw += Number(String(m.krw).replace(/,/g, '')) || 0; });
  return thb > 0 ? { rate: Math.round(krw / thb * 100) / 100, thb: thb, krw: krw } : null;
}
/* 정산 환율 바꾸기 (관리자) */

  T.push({ id: 'tr', title: '이렇게 보내면 끝 (송금)', head: ['보내는 사람', '받는 사람', '금액(원)', '보냈어요', '받았어요'],
    rows: c.transfers.length ? c.transfers.map(function (t) { var k = t.from + '>' + t.to; return [t.from, t.to, t.krw, mark('sent:' + k, t.krw), mark('recv:' + k, t.krw)]; }) : [['주고받을 돈이 없습니다', '', '', '', '']] });

  T.push({ id: 'day', title: '날짜별', head: ['날짜', '바트', '원'],

      return [e.date, e.category, e.title, Number(e.thb) || 0, R(Number(e.thb) || 0), payer, e.kind, e.support_thb ? Number(e.support_thb) : '', e.kind === '지원' ? '' : p.join(' '), e.kind === '지원' ? '' : p.length, e.memo, e.created_by];
    }), note: '원 = 바트 × 정산 환율' });

function round2(n) { return Math.round(Number(n) * 100) / 100; }
function tripTitle() { return (S.D.settings && S.D.settings.trip_title) || document.title || '여행'; }
function tripRange() { var ds = dates(); return ds.length ? ds[0] + ' ~ ' + ds[ds.length - 1] : ''; }

/* 인쇄 · PDF: 정산 보고서만 깔끔하게 (폰에서는 인쇄 → PDF로 저장) */
function printReport() {
  var T = reportTables(), by = {}; T.forEach(function (t) { by[t.id] = t; });
  function cell(v, i, head) { var isNum = typeof v === 'number'; return '<td' + (isNum ? ' class="n"' : '') + '>' + (isNum ? num(v) : esc(v === undefined || v === null ? '' : v)) + '</td>'; }
  function table(t, cols) {
    if (!t) return '';
    var idx = cols || t.head.map(function (_, i) { return i; });
    return '<h2>' + esc(t.title) + '</h2><table><thead><tr>' + idx.map(function (i) { return '<th' + (/바트|원|금액|인원|비율|차액|몫|돈/.test(t.head[i]) ? ' class="n"' : '') + '>' + esc(t.head[i]) + '</th>'; }).join('') + '</tr></thead><tbody>' +
      t.rows.map(function (r, k) { return '<tr' + (t.total && k === t.rows.length - 1 ? ' class="tot"' : '') + '>' + idx.map(function (i) { return cell(r[i], i, t.head); }).join('') + '</tr>'; }).join('') +
      '</tbody></table>' + (t.note ? '<p class="note">' + esc(t.note) + '</p>' : '');
  }
  var html = '<h1>' + esc(tripTitle()) + ' · 정산 보고서</h1>' +
    '<div class="meta">' + esc(tripRange()) + ' · 정산 환율 ฿1 = ' + settleRate() + '원 · 만든 날 ' + localNow().date + ' (' + esc(S.me.name) + ')</div>' +
    table(by.tr) + table(by.sum) + table(by.mem) +
    '<div class="two"><div>' + table(by.cat) + '</div><div>' + table(by.day) + '</div></div>' +
    table(by.exp, [0, 1, 2, 3, 4, 5, 6, 8, 10]) +
    table(by.wal) + table(by.mv) +
    '<div class="two"><div>' + table(by.fee) + '</div><div>' + table(by.feeu, [0, 1, 2]) + '</div></div>';
  var d = el('#printRep');
  if (!d) { d = document.createElement('div'); d.id = 'printRep'; document.body.appendChild(d); }
  d.innerHTML = html;
  document.body.classList.add('printing');
  var done = function () { document.body.classList.remove('printing'); window.removeEventListener('afterprint', done); };
  window.addEventListener('afterprint', done);
  setTimeout(function () { window.print(); setTimeout(done, 1500); }, 50);
}

/* 엑셀(.xlsx): 표마다 시트 하나. 라이브러리는 누를 때만 불러옴. 안 되면 CSV로 */
var XLSX_URL = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
function loadScript(u) {
  return new Promise(function (ok, no) { if (window.XLSX) return ok(); var sc = document.createElement('script'); sc.src = u; sc.onload = ok; sc.onerror = no; document.head.appendChild(sc); });
}
function downloadXlsx() {
  toast('엑셀 파일을 만드는 중…');
  loadScript(XLSX_URL).then(function () {
    var T = reportTables(), wb = XLSX.utils.book_new();
    var groups = [['요약', ['sum', 'tr', 'mem']], ['지출 내역', ['exp']], ['항목·날짜별', ['cat', 'day']], ['공금', ['wal', 'mv']], ['회비', ['fee', 'feeu']]];
    var by = {}; T.forEach(function (t) { by[t.id] = t; });
    groups.forEach(function (g) {
      var aoa = [];
      if (g[0] === '요약') aoa.push([tripTitle() + ' · 정산 보고서'], [tripRange() + ' · 정산 환율 ฿1 = ' + settleRate() + '원 · 만든 날 ' + localNow().date], []);
      g[1].forEach(function (id) { var t = by[id]; if (!t) return; aoa.push(['■ ' + t.title]); aoa.push(t.head); t.rows.forEach(function (r) { aoa.push(r); }); if (t.note) aoa.push([t.note]); aoa.push([]); });
      var ws = XLSX.utils.aoa_to_sheet(aoa);
      Object.keys(ws).forEach(function (k) { var c = ws[k]; if (k[0] !== '!' && c.t === 'n') c.z = c.v % 1 ? '#,##0.00' : '#,##0'; });   // 천단위 콤마
      var widths = []; aoa.forEach(function (r) { if (r.length < 2) return; r.forEach(function (v, i) { var l = String(v === undefined ? '' : v).length; widths[i] = Math.min(40, Math.max(widths[i] || 6, l + 2)); }); });
      ws['!cols'] = widths.map(function (w) { return { wch: w * 1.6 > 50 ? 50 : Math.ceil(w * 1.6) }; });
      XLSX.utils.book_append_sheet(wb, ws, g[0]);
    });
    XLSX.writeFile(wb, '태국여행_정산_' + localNow().date + '.xlsx');
