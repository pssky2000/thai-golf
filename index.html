  els('[data-tcat]', m).forEach(function (b) { b.onclick = function () { S.thaiCat = b.dataset.tcat; renderMain(); }; });
  els('[data-tp]', m).forEach(function (b) {
    b.onclick = function () {
      var p = THAI[S.thaiCat || '인사'][Number(b.dataset.tp)];
      sheet('<div class="thai-big"><div class="small muted">' + esc(p[0]) + '</div><div class="th">' + esc(p[2]) + '</div><div class="say">' + esc(p[1]) + '</div></div>' +
        '<button class="btn" style="width:100%;margin-top:14px" data-close>닫기</button>', null, true);
    };
  });
  els('[data-admin]', m).forEach(function (d) { d.ontoggle = function () { S.adminOpen = d.open; }; });
  els('[data-theme]', m).forEach(function (b) {
    b.onclick = function () {
      var v = b.dataset.theme; LS.set('trip_theme', v);
      if (v === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', v);
      renderMain();
    };
  });
  els('[data-itab]', m).forEach(function (b) { b.onclick = function () { S.infoTab = b.dataset.itab; LS.set('trip_itab', S.infoTab); renderMain(); }; });
  els('[data-open]', m).forEach(function (b) {
    b.onclick = function () {
      if (dragState || Date.now() < suppressClickUntil) return;
      openItem(b.dataset.open);
    };
  });
  els('[data-pt]', m).forEach(function (b) { b.onclick = function () { S.mapSel[S.tab] = b.dataset.pt; renderMain(); }; });
  els('[data-shift]', m).forEach(function (b) {
    b.onclick = function () {
      var its = itemsOf(S.tab), idx = its.map(function (x) { return x.id; }).indexOf(b.dataset.shift);
      var ids = its.slice(idx).filter(function (x) { return !x.fixed; }).map(function (x) { return x.id; });
      var mins = Number(b.dataset.min);
      confirmBox('이 일정부터 이후 일정 ' + ids.length + '개를 ' + mins + '분씩 미룰까요? (🔒 고정 일정은 그대로)', mins + '분 미루기').then(function (y) {
        if (!y) return;
        call('shiftItems', { ids: ids, minutes: mins }).then(function (r) { S.D.items = r.items; renderMain(); afterAdminToast(r); }).catch(function (e) { toast(e.message); });
      });
    };
  });
  els('[data-act]', m).forEach(function (b) {
    b.onclick = function () {
      var a = b.dataset.act;
      if (a === 'edit-on') { S.editMode = true; renderMain(); }
      else if (a === 'edit-off') { S.editMode = false; renderMain(); }
      else if (a === 'add') editItem(null);
      else if (a === 'pin') renderPinChange(null, false);
      else if (a === 'req') requestEdit(null);
      else if (a === 'logout') confirmBox('이 폰에서 나갈까요? 다시 들어올 때 PIN이 필요합니다.', '나가기').then(function (y) { if (!y) return; call('logout').catch(function () {}); logoutLocal(); renderLogin(); });
      else if (a === 'log') loadLog();
      else if (a === 'exp-add') expenseForm(null);
      else if (a === 'exp-csv') downloadCsv();
      else if (a === 'exp-print') window.print();
      else if (a === 'fee-in') feeForm('in');
      else if (a === 'fee-use') feeForm('use');
      else if (a === 'copy-link') {
        var url = IN_GAS ? (S.D.app_url || '') : location.href.split(/[?#]/)[0];
        var done = function () { toast('링크를 복사했습니다. Chrome 주소창에 붙여넣으세요.'); };
        var manual = function () { sheet('<h3>🔗 앱 링크</h3><p class="small muted">아래 글자를 길게 눌러 복사하세요.</p><textarea class="inp" rows="4" readonly>' + esc(url) + '</textarea><button class="btn" data-close>닫기</button>'); };
        if (!url) { toast('링크를 찾지 못했습니다. 카톡으로 받은 링크를 쓰세요.'); }
        else if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(url).then(done, manual);
        else manual();
      }
      else if (a === 'ai-check') {
        var s0 = sheet('<h3>🔍 사진 인식 점검</h3><pre id="aic" style="white-space:pre-wrap;font-size:13px">점검 중… (10초 정도)</pre><button class="btn" data-close>닫기</button>');
        call('aiCheck').then(function (r) { el('#aic', s0).textContent = r.report; }).catch(function (e) { el('#aic', s0).textContent = '점검 실패: ' + e.message; });
      }
    };
  });
  // 스코어카드
  els('[data-scan]', m).forEach(function (inp) { inp.onchange = function () { var f = inp.files && inp.files[0]; if (f) scanScorecard(f); inp.value = ''; }; });
  els('[data-cards]', m).forEach(function (a) { a.onclick = function (ev) { ev.preventDefault(); showCards(a.dataset.cards); }; });
  // 경비
  els('[data-mtab]', m).forEach(function (b) { b.onclick = function () { S.moneyTab = b.dataset.mtab; renderMain(); }; });
  els('[data-exp]', m).forEach(function (b) {
    b.onclick = function () { var e = (S.D.expenses || []).filter(function (x) { return x.id === b.dataset.exp; })[0]; if (e) expenseForm(e); };
  });
  els('[data-mark]', m).forEach(function (b) {
    b.onclick = function () {
      call('settleMark', { key: b.dataset.mark, on: !!b.dataset.on }).then(function (r) { S.D.settle = r.settle; saveCache(); renderMain(); }).catch(function (e) { toast(e.message); });
    };
  });
  els('[data-feedel]', m).forEach(function (a) {
    a.onclick = function (ev) {
      ev.preventDefault();
      var p = a.dataset.feedel.split(':');
      confirmBox('이 회비 기록을 지울까요?', '삭제').then(function (y) {
        if (!y) return;
        call('deleteFee', { kind: p[0], id: p[1] }).then(function (r) { S.D.fees = r.fees; S.D.feeUses = r.feeUses; saveCache(); renderMain(); }).catch(function (e) { toast(e.message); });
      });
    };
  });
  if (S.me.isAdmin) els('#tl .it', m).forEach(bindLongPress);
  // 환율 계산기
  var fa = el('#fxa', m), fb = el('#fxb', m);
  if (fa) {
    fa.oninput = function () { var r = S.fx && S.fx.rate, v = parseFloat(fa.value.replace(/,/g, '')); fb.value = r && isFinite(v) ? num(Math.round(v * r)) : ''; };
    fb.oninput = function () { var r = S.fx && S.fx.rate, v = parseFloat(fb.value.replace(/,/g, '')); fa.value = r && isFinite(v) ? num(Math.round(v / r)) : ''; };
  }
  // 스코어
  els('[data-round]', m).forEach(function (b) { b.onclick = function () { S.scoreRound = b.dataset.round; renderMain(); }; });
  bindFor(m);
  els('[data-mode]', m).forEach(function (b) {
    b.onclick = function () {
      var sc = currentScore();
      if (b.dataset.mode === sc.mode) return;
      if (b.dataset.mode === 'half' && filled(parseHoles(sc))) {
        confirmBox('홀별 기록을 지우고 전·후반 합계만 남길까요?', '바꾸기').then(function (y) { if (!y) return; sc.mode = 'half'; sc.holes = ''; LS.set('trip_mode', 'half'); queueSave(sc); renderMain(); });
        return;
      }
      sc.mode = b.dataset.mode; LS.set('trip_mode', sc.mode);
      if (sc.mode === 'holes') sc.holes = JSON.stringify(parseHoles(sc));
      queueSave(sc); renderMain();
    };
  });
  els('[data-half]', m).forEach(function (inp) {
    inp.oninput = function () {
      var sc = currentScore(); var v = inp.value.replace(/\D/g, '').slice(0, 2); inp.value = v;
      sc[inp.dataset.half] = v === '' ? '' : Number(v); sc.mode = 'half';
      refreshTotals(sc); queueSave(sc);
    };
  });
  els('[data-step]', m).forEach(function (b) {
    b.onclick = function () {
      var sc = currentScore(), k = b.dataset.step;
      var cur = sc[k] === '' || sc[k] === undefined ? (k === 'front' || k === 'back' ? 45 : 0) : Number(sc[k]);
      if (sc[k] !== '' && sc[k] !== undefined) cur += Number(b.dataset.d);
      cur = Math.max(1, Math.min(99, cur));
      sc[k] = cur; sc.mode = 'half';
      el('[data-half="' + k + '"]', m).value = cur;
      refreshTotals(sc); queueSave(sc);
    };
  });
  els('[data-hole]', m).forEach(function (inp) {
    inp.oninput = function () {
      var sc = currentScore(), h = parseHoles(sc); while (h.length < 18) h.push('');
      var v = inp.value.replace(/\D/g, '').slice(0, 2); inp.value = v;
      h[Number(inp.dataset.hole)] = v === '' ? '' : Number(v);
      sc.holes = JSON.stringify(h); sc.mode = 'holes';
      sc.front = sumHoles(h, 0, 9); sc.back = sumHoles(h, 9, 18);
      refreshTotals(sc); queueSave(sc);
      if (v.length >= (v === '1' ? 2 : 1)) { var nx = el('[data-hole="' + (Number(inp.dataset.hole) + 1) + '"]', m); if (nx && v !== '1') nx.focus(); }
    };
  });
  // 관리자
  els('[data-res]', m).forEach(function (b) {
    b.onclick = function () {
      call('resolveRequest', { id: b.dataset.res, status: b.dataset.st }).then(function () {
        S.D.requests.forEach(function (r) { if (r.id === b.dataset.res) r.status = b.dataset.st; }); renderMain();
      }).catch(function (e) { toast(e.message); });
    };
  });
  els('[data-ropen]', m).forEach(function (b) { b.onclick = function () { openItem(b.dataset.ropen); }; });
  els('[data-reset]', m).forEach(function (b) {
    b.onclick = function () {
      confirmBox(b.dataset.reset + ' 님 PIN을 임시 번호로 초기화할까요?', '초기화').then(function (y) {
        if (!y) return;
        call('resetPin', { name: b.dataset.reset }).then(function (r) {
          sheet('<h3>임시 PIN</h3><p><b>' + esc(r.name) + '</b> 님 임시 PIN: <b style="font-size:24px;letter-spacing:4px">' + esc(r.tempPin) + '</b></p><p class="small muted">본인에게 따로 알려 주세요. 다음 입장 때 새 PIN으로 바꾸게 됩니다. 이 창을 닫으면 다시 볼 수 없습니다(구글 시트 "회원" 탭에는 남음).</p><button class="btn pri" data-close>확인</button>');
        }).catch(function (e) { toast(e.message); });
      });
    };
  });
}

}

/* 꾹 눌러 끌기 (관리자) — 손가락은 touch 이벤트, PC는 마우스 */
var suppressClickUntil = 0, lp = null;
function bindLongPress(li) {
  function arm(x, y, mouse) {
    lp = { li: li, x: x, y: y, mouse: mouse, fired: false };
    lp.timer = setTimeout(function () {
      if (!lp) return;
      lp.fired = true;
      if (navigator.vibrate) { try { navigator.vibrate(30); } catch (e) {} }
      startDrag(li, { clientY: lp.y });
    }, 450);
  }
  li.addEventListener('touchstart', function (e) { if (e.touches.length === 1) arm(e.touches[0].clientX, e.touches[0].clientY, false); }, { passive: true });
  li.addEventListener('mousedown', function (e) { if (e.button === 0) arm(e.clientX, e.clientY, true); });
  li.addEventListener('contextmenu', function (e) { e.preventDefault(); });
}
function cancelPress() { if (lp) { clearTimeout(lp.timer); lp = null; } }
function endPress() {
  if (lp) { clearTimeout(lp.timer); if (lp.fired) suppressClickUntil = Date.now() + 500; lp = null; }
  if (dragState) endDrag();
}
function pressMove(x, y, ev) {
  if (dragState) { ev.preventDefault(); moveDrag({ clientX: x, clientY: y, preventDefault: function () {} }); return; }
  if (lp && !lp.fired && (Math.abs(x - lp.x) > 10 || Math.abs(y - lp.y) > 10)) cancelPress();
}
document.addEventListener('touchmove', function (e) { pressMove(e.touches[0].clientX, e.touches[0].clientY, e); }, { passive: false });
document.addEventListener('touchend', endPress);
document.addEventListener('touchcancel', endPress);
document.addEventListener('mousemove', function (e) { pressMove(e.clientX, e.clientY, e); });
document.addEventListener('mouseup', endPress);

var sw = null;
document.addEventListener('touchstart', function (e) {
  if (dragState || el('.sheet-bg') || e.target.closest('input,textarea,select,iframe,.tabs,.rounds,.handle,.tbl')) { sw = null; return; }
  sw = { x: e.touches[0].clientX, y: e.touches[0].clientY, t: Date.now() };
}, { passive: true });
document.addEventListener('touchend', function (e) {
  if (!sw || !S.D || dragState || (lp && lp.fired)) { sw = null; return; }
  var dx = e.changedTouches[0].clientX - sw.x, dy = e.changedTouches[0].clientY - sw.y;
  if (Math.abs(dx) > 70 && Math.abs(dy) < 50 && Date.now() - sw.t < 600) {
    var keys = els('[data-tab]').map(function (b) { return b.dataset.tab; });
    var i = keys.indexOf(S.tab) + (dx < 0 ? 1 : -1);
    if (i >= 0 && i < keys.length) go(keys[i]);
  }
  sw = null;
}, { passive: true });

/* ═════════ 환율 · 날씨 ═════════ */
function loadFx() {
  var s = S.D.settings, from = String(s.currency || 'THB').toLowerCase(), to = String(s.base_currency || 'KRW').toLowerCase();
  fetch('https://api.frankfurter.dev/v2/rate/' + from + '/' + to, { cache: 'no-store' })
    .then(function (r) { if (!r.ok) throw 0; return r.json(); })
    .then(function (d) { if (!isFinite(d.rate) || d.rate <= 0) throw 0; return { rate: d.rate, date: d.date }; })
    .catch(function () {
      return fetch('https://api.frankfurter.app/latest?from=' + from.toUpperCase() + '&to=' + to.toUpperCase())
        .then(function (r) { if (!r.ok) throw 0; return r.json(); })
        .then(function (d) { var v = d.rates && d.rates[to.toUpperCase()]; if (!isFinite(v)) throw 0; return { rate: v, date: d.date }; });
    })
    .catch(function () { return { rate: Number(s.fallback_rate), date: '정산 환율', fallback: true }; })
    .then(function (fx) { S.fx = fx; if (el('#fxa') || S.tab === 'all' || S.tab === 'info') rerenderSoft(); });
}
function loadWx() {
  var s = S.D.settings;
  fetch('https://api.open-meteo.com/v1/forecast?latitude=' + s.weather_lat + '&longitude=' + s.weather_lng +
    '&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,uv_index_max&timezone=' + encodeURIComponent(s.timezone || 'Asia/Bangkok') + '&forecast_days=16')
    .then(function (r) { return r.json(); })
    .then(function (j) {
      var out = {}, d = j.daily || {};
      (d.time || []).forEach(function (t, i) {
        out[t] = { code: d.weather_code[i], max: d.temperature_2m_max[i], min: d.temperature_2m_min[i], rain: d.precipitation_probability_max[i], uv: d.uv_index_max[i] };
      });
      S.wx = out;
      if (/^\d{4}-/.test(S.tab)) rerenderSoft();
    }).catch(function () { S.wx = {}; });
}
function rerenderSoft() {
  if (el('.sheet-bg') || dragState) return;
  var a = document.activeElement;
  if (a && /INPUT|TEXTAREA/.test(a.tagName)) return;
  renderMain();
}

  if (!S.D || document.hidden || !S.token) return;
  if (S.tab === 'score' || (/^\d{4}-/.test(S.tab) && S.D.rounds.some(function (r) { return r.date === localNow().date; }))) {

}, 15000);

  call('data').then(function (d) {
    if (S.queue.length) d.scores = S.D.scores;
    S.D = d; S.me = d.me; saveCache(); rerenderSoft();

}, 60000);
setInterval(function () { if (S.D && /^\d{4}-/.test(S.tab)) rerenderSoft(); }, 60000);  // 다음 일정 남은 시간
document.addEventListener('visibilitychange', function () { if (!document.hidden && S.D) { flushQueue(); call('data').then(function (d) { if (S.queue.length) d.scores = S.D.scores; S.D = d; saveCache(); rerenderSoft(); }).catch(function () {}); } });

/* ═════════ 뒤로가기 ═════════ */
/* 원칙 (2026-11-12 결정): 확인 없이 바로 나감. 뒤로가기는 열린 창만 닫고, 창이 없으면 다른 앱처럼 그대로 꺼짐
 *  - 창(sheet)을 열 때 기록 한 칸을 넣고(openSheetEntry), 뒤로가기로 그 칸이 빠지면 창을 닫음
 *  - 창을 버튼으로 닫으면 넣었던 칸을 스스로 빼 둠 (closeSheet → history.back)
 *  - 칸이 남아 있는데 닫을 창이 없으면(옛 버전이 남긴 칸 등) 이어서 한 칸 더 뒤로 → 사용자는 한 번만 누르면 됨
 *  - 같은 탭에 옛 앱 기록이 쌓여 있으면(링크로 여러 번 연 탭) 뒤로가기 때 옛 앱이 다시 열림
 *    → 뒤로가기로 열린 옛 앱은 남은 앱 기록을 한 번에 건너뜀 */
var BACK_OK = window.top === window;   // 구글 화면(iframe) 안에서는 폰 뒤로가기를 잡을 수 없음
var NAV = window.navigation && typeof navigation.entries === 'function' ? navigation : null;
var popIgnore = 0;
LS.del('trip_backlog');   // 예전 점검 기록 지움
function onSheetEntry() { return !!(history.state && history.state.tripSheet); }
function openSheetEntry() {
  if (!BACK_OK || onSheetEntry() || popIgnore) return;
  try { history.pushState({ tripSheet: 1 }, ''); } catch (e) {}
}
function dropSheetEntry() {
  if (!BACK_OK || !onSheetEntry() || popIgnore) return;
  popIgnore = 1; history.back();
}
if (BACK_OK) window.addEventListener('popstate', function () {
  if (popIgnore) {   // 창을 버튼으로 닫으면서 스스로 뺀 칸
    popIgnore = 0;
    if (el('.sheet-bg')) openSheetEntry();   // 그 사이 다른 창이 열렸으면 다시 칸을 넣음
    return;
  }
  if (el('.picker')) { closePicker(); if (el('.sheet-bg')) openSheetEntry(); return; }   // 타수 고르기 창만 닫기
  if (el('.sheet-bg')) { removeSheets(); return; }   // 뒤로가기 → 창만 닫기
  if (history.state && (history.state.tripTrap || history.state.tripSheet)) history.back();   // 남은 빈 칸은 건너뜀
});
/* 같은 탭에 옛 앱 기록이 쌓여 있을 때 (링크·바로가기로 같은 탭에서 여러 번 연 경우)
 *  - 웹페이지는 기록을 지울 수 없음. 앱의 '첫 기록'에서 뒤로가기를 눌러야 바로 꺼짐
 *  - 새로 열었는데 앞에 옛 앱 기록이 있으면 → 첫 앱 기록으로 옮겨서 엶 (그 뒤 뒤로가기 한 번에 꺼짐)
 *  - 뒤로가기로 옛 앱 기록이 열리면 → 남은 앱 기록을 한 번에 건너뜀 */
function appEntries() {
  if (!NAV || !NAV.currentEntry) return null;
  var es = NAV.entries(), idx = NAV.currentEntry.index, j = idx;
  var path = function (u) { try { return new URL(u).pathname.replace(/index\.html$/i, '').replace(/Index\.html$/, ''); } catch (e) { return ''; } };
  var me = path(location.href);
  while (j > 0 && es[j - 1] && path(es[j - 1].url) === me) j--;
  // 옛 앱 기록 = 다른 페이지 로드의 기록. 같은 페이지 안의 기록(창 열 때 넣은 칸)은 옛 기록이 아님
  var old = false;
  for (var k = j; k < idx; k++) if (es[k] && !es[k].sameDocument) old = true;
  return { idx: idx, first: j, old: old, before: j > 0 || history.length > es.length };
}
var jumpAt = 0;
(function fixOldEntries() {
  var a = NAV && NAV.activation, r = appEntries();
  if (!BACK_OK || !a || !r) return;
  var jt = 0; try { jt = Number(sessionStorage.getItem('trip_jump') || 0); sessionStorage.removeItem('trip_jump'); } catch (e) {}
  if (a.navigationType === 'traverse') {
    if (jt && Date.now() - jt < 10000) return;   // 아래 '첫 기록으로 옮기기'로 온 것 → 그대로 사용
    if (!(a.from && a.entry && a.from.index > a.entry.index)) return;   // 앞으로 가기 등
    if (r.before) history.go(-(r.idx - r.first + 1));   // 앱 앞에 다른 페이지가 있으면 그리로 바로 나감
    else if (r.idx > r.first) history.go(-(r.idx - r.first));
    return;
  }
  if (r.old && r.idx > r.first) {   // 새로 열었는데 앞에 옛 앱 기록이 있음
    try { sessionStorage.setItem('trip_jump', String(Date.now())); } catch (e) {}
    jumpAt = Date.now();
    history.go(-(r.idx - r.first));
  }
})();

start();   // 옮기는 중이어도 일단 시작 (옮기기가 안 돼도 화면이 멈추지 않게)
// 창이 열린 채 새로고침하면 창 없는 '창 칸'이 남음 → 조용히 빼 둠 (뒤로가기 한 번 헛누름 방지)
if (BACK_OK && !jumpAt && history.state && (history.state.tripSheet || history.state.tripTrap)) { popIgnore = 1; history.back(); }
})();
</script>
