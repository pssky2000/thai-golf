<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<base target="_top">
<title>골프여행</title>
<meta name="theme-color" content="#1f7a4d">
<meta name="color-scheme" content="light dark">
<script>try { var th = JSON.parse(localStorage.getItem('trip_theme')); if (th === 'light' || th === 'dark') document.documentElement.setAttribute('data-theme', th); } catch (e) {}</script>
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<script>
  // GitHub Pages(홈 화면 앱)에서만 화면 파일을 저장해 둠
  if ('serviceWorker' in navigator && location.protocol === 'https:' && /github\.io$/.test(location.hostname)) {
    window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).catch(function () {}); });
  }
</script>
<script>
  // 내 PC에서 미리보기할 때만 가짜 서버를 불러옴 (구글 배포본에서는 실행되지 않음)
  if (/^(localhost|127\.0\.0\.1)$/.test(location.hostname)) {
    document.write('<script src="preview/gas-mock.js"><\/script><script src="Code.gs"><\/script><script src="Setup.gs"><\/script><script src="preview/gas-mock-init.js"><\/script>');
  }
</script>
<style>
:root{
  --bg:#f4f6f3; --card:#ffffff; --ink:#18221b; --sub:#5d6b61; --line:#dfe6e0;
  --pri:#1f7a4d; --pri-ink:#ffffff; --pri-soft:#e3f1e8;
  --warn:#c26a00; --warn-soft:#fff3e0; --bad:#c62828; --bad-soft:#fdecea; --good:#2e7d32;
  --flight:#3f51b5; --golf:#1f7a4d; --meal:#d35400; --move:#607d8b; --hotel:#6d4c9f; --massage:#ad1457; --shop:#00838f; --rest:#8d6e63;
  --shadow:0 1px 3px rgba(0,0,0,.08),0 4px 14px rgba(0,0,0,.05);
  --r:16px; --fs:1.3;
  --nav-bg:#d6e8dc; --nav-line:#7fb394;   /* 아래 메뉴: 본문과 구분되는 색 */
  --day-bg:#ffffff; --day-line:#c9dccf;
}
@media (prefers-color-scheme: dark){:root:not([data-theme=light]){
    --bg:#0f1511; --card:#18211b; --ink:#e8efe9; --sub:#9aa9a0; --line:#2a362e;
    --pri:#48b47c; --pri-ink:#08130c; --pri-soft:#1d3326;
    --warn:#ffb74d; --warn-soft:#3a2a10; --bad:#ef5350; --bad-soft:#3b1a19; --good:#66bb6a;
    --shadow:none;
    --nav-bg:#26342b; --nav-line:#3f6b4f;
    --day-bg:#212e25; --day-line:#3a5143;
  }}
:root[data-theme=dark]{
    --bg:#0f1511; --card:#18211b; --ink:#e8efe9; --sub:#9aa9a0; --line:#2a362e;
    --pri:#48b47c; --pri-ink:#08130c; --pri-soft:#1d3326;
    --warn:#ffb74d; --warn-soft:#3a2a10; --bad:#ef5350; --bad-soft:#3b1a19; --good:#66bb6a;
    --shadow:none;
    --nav-bg:#26342b; --nav-line:#3f6b4f;
    --day-bg:#212e25; --day-line:#3a5143;
  }
/* 화면 밝기: 자동(폰 설정) / 밝게 / 어둡게. color-scheme을 밝혀 두면 Chrome이 멋대로 어둡게 바꾸지 않음 */
:root{color-scheme:light dark}
:root[data-theme=light]{color-scheme:light}
:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box}
html{background:var(--bg);min-height:100%}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;font-size:calc(16px*var(--fs));line-height:1.45;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--pri)}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px 120px}
.hidden{display:none!important}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;margin:12px 0}
.muted{color:var(--sub)}
.small{font-size:calc(13px*var(--fs))}
.row{display:flex;gap:8px;align-items:center}
.between{justify-content:space-between}
.wrap-row{flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 14px;min-height:44px}
.btn.pri{background:var(--pri);color:var(--pri-ink);border-color:var(--pri);font-weight:700}
.btn.ghost{background:transparent}
.btn.bad{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:6px 10px;min-height:36px;font-size:calc(14px*var(--fs));border-radius:10px}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:3px 10px;font-size:calc(13px*var(--fs));background:var(--pri-soft);color:var(--pri);font-weight:600}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
input.inp,select.inp,textarea.inp{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 12px;min-height:44px}
label.lb{display:block;font-size:calc(13px*var(--fs));color:var(--sub);margin:10px 0 4px}

/* 헤더 */
header.top{padding:14px 0 4px}
.title{font-size:calc(20px*var(--fs));font-weight:800;margin:0}
.dday{font-weight:800;color:var(--pri);white-space:nowrap;margin-left:8px}
header.top .title{font-size:calc(17px*var(--fs));line-height:1.25}

/* 항공 카드 */
.flights{display:grid;gap:10px}
@media(min-width:720px){.flights{grid-template-columns:1fr 1fr}}
.flight{border-radius:var(--r);padding:14px 16px;background:linear-gradient(135deg,#0d47a1,#1e88e5);color:#fff}   /* 가는 날: 파랑 */
.flight.back{background:linear-gradient(135deg,#b23c00,#ef7d00)}   /* 오는 날: 주황 */
/* 요약 화면 날짜 상자: 바탕과 구분 */
.daycard{background:var(--day-bg);border:1px solid var(--day-line);border-left:6px solid var(--pri)}
.daycard .dhead{color:var(--pri)}
.flight .lbl{font-size:calc(13px*var(--fs));opacity:.9;font-weight:700;white-space:nowrap}
.flight .no{font-size:calc(15px*var(--fs));font-weight:800;letter-spacing:.5px;white-space:nowrap}
.flight .fhead{flex-wrap:wrap;row-gap:2px}
.flight .times{display:flex;align-items:center;justify-content:space-between;margin:8px 0 4px}
.flight .t{font-size:calc(30px*var(--fs));font-weight:800;line-height:1}
.flight .ap{font-size:calc(13px*var(--fs));opacity:.9}
.flight .arrow{font-size:calc(20px*var(--fs));opacity:.8}
.flight .meta{font-size:calc(13px*var(--fs));opacity:.92;margin-top:6px}
.flight .fnote>div{margin-top:2px}
.flight .times{align-items:flex-start}
.flight .times .arrow{align-self:center}
.flight .meet-link{color:#fff;text-decoration:underline}
.flight .kr{font-size:calc(12px*var(--fs));opacity:.8}

/* 환율 */
.fx-grid{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center}
.fx-grid input{text-align:right;font-size:calc(18px*var(--fs));font-weight:700}

/* 탭 */
nav.tabs{position:sticky;top:0;z-index:20;background:var(--bg);padding:8px 0;margin:0 -16px;border-bottom:1px solid var(--line)}
.tabs-in{display:flex;gap:6px;overflow-x:auto;padding:0 16px;scrollbar-width:none}
.tabs-in::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:6px 12px;text-align:center;min-width:64px}
.tab .d{font-weight:800;font-size:calc(15px*var(--fs));display:block}
.tab .s{font-size:calc(12px*var(--fs));color:var(--sub);display:block;white-space:nowrap}
.tab.on{background:var(--pri);border-color:var(--pri);color:var(--pri-ink)}
.tab.on .s{color:var(--pri-ink);opacity:.85}
.tab.today:not(.on){border-color:var(--pri);box-shadow:inset 0 0 0 1px var(--pri)}
.tab.drop{outline:3px dashed var(--warn)}

/* 다음 일정 */
.next{display:flex;gap:12px;align-items:center;border-radius:var(--r);padding:14px 16px;background:var(--pri-soft);border:1px solid var(--pri)}
.next.soon{background:var(--warn-soft);border-color:var(--warn)}
.next .big{font-size:calc(18px*var(--fs));font-weight:800}

/* 날씨 */
.wx{display:flex;gap:14px;align-items:center}
.wx .ico{font-size:calc(34px*var(--fs))}
.wx .temp{font-size:calc(22px*var(--fs));font-weight:800}

/* 날짜 화면 */
.day-grid{display:block}
.day-grid .map-col{margin:12px 0}
@media(min-width:960px){
  .day-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
  .day-grid .list-col{grid-column:1;grid-row:1}
  .day-grid .map-col{grid-column:2;grid-row:1;position:sticky;top:76px;margin:0}
}
.map-head{display:flex;justify-content:space-between;align-items:center;padding:10px 12px}
.edit-btn{width:100%;margin:4px 0 8px;border-style:dashed;border-color:var(--pri);color:var(--pri);font-weight:700}
.edit-on{border:2px solid var(--pri)}
.tl{list-style:none;margin:0;padding:0}
.it{display:flex;gap:10px;align-items:stretch;background:var(--card);border:1px solid var(--line);border-radius:14px;margin:8px 0;padding:10px 12px;box-shadow:var(--shadow);touch-action:pan-y}
.it .tm{width:calc(54px*var(--fs));flex:0 0 calc(54px*var(--fs));font-weight:800;font-variant-numeric:tabular-nums}
.it .tm .lock{font-size:calc(12px*var(--fs))}
.it .bar{width:4px;border-radius:4px;background:var(--move)}
.it .body{flex:1;min-width:0}
.it .ttl{font-weight:700}
.it .plc{font-size:calc(14px*var(--fs));color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it .memo{font-size:calc(13px*var(--fs));color:var(--sub)}
.it .side{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.it .letter{width:24px;height:24px;border-radius:50%;background:#d93025;color:#fff;font-size:calc(13px*var(--fs));font-weight:800;display:flex;align-items:center;justify-content:center}
.it .handle{font-size:calc(22px*var(--fs));padding:4px 6px;color:var(--sub);touch-action:none;cursor:grab;user-select:none}
.it.dragging{opacity:.9;box-shadow:0 10px 30px rgba(0,0,0,.25);position:relative;z-index:30}
.it.placeholder{border:2px dashed var(--pri);background:transparent;box-shadow:none}
.it.fixed .tm{color:var(--pri)}
.it.changed{border-color:var(--warn)}
.ty-flight .bar{background:var(--flight)} .ty-golf .bar{background:var(--golf)} .ty-meal .bar{background:var(--meal)}
.ty-hotel .bar{background:var(--hotel)} .ty-massage .bar{background:var(--massage)} .ty-shop .bar{background:var(--shop)} .ty-rest .bar{background:var(--rest)}
.seg{display:flex;align-items:center;gap:8px;margin:0 0 0 calc(70px*var(--fs));font-size:calc(13px*var(--fs));color:var(--sub);flex-wrap:wrap}
.seg .live{border:1px solid var(--line);border-radius:999px;padding:2px 8px;text-decoration:none;color:var(--ink);background:var(--card)}
.seg.late{color:var(--bad);font-weight:700}
.map-box{border-radius:var(--r);overflow:hidden;border:1px solid var(--line);background:var(--card)}
.map-box iframe{width:100%;height:260px;border:0;display:block;background:var(--line)}
@media(min-width:960px){.map-box iframe{height:520px}}
.pts{display:flex;gap:6px;flex-wrap:wrap;padding:10px}
.pt{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:4px 10px;font-size:calc(13px*var(--fs))}
.pt b{color:#d93025}
.pt.on{background:var(--pri);color:var(--pri-ink);border-color:var(--pri)}
.pt.on b{color:var(--pri-ink)}

/* 스코어 */
.rounds{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.sc-me{border:2px solid var(--pri)}
.sc-big{display:grid;grid-template-columns:1fr 1fr;gap:10px;text-align:center}
.sc-big .lab,.sc-total .lab{font-size:calc(13px*var(--fs));color:var(--sub)}
/* 폰: 전반·후반 한 줄, 합계는 후반 바로 아래(같은 가운데 정렬) / 넓은 화면: 전반·후반·합계 한 줄 */
.sc-total{grid-column:2;text-align:center;padding-top:6px;border-top:1px dashed var(--line)}
.sc-total .sum{line-height:1.1}
@media(min-width:600px){
  .sc-big{grid-template-columns:1fr 1fr 1fr}
  .sc-total{grid-column:auto;border-top:0;padding-top:0}
}
.stepper{display:flex;align-items:center;justify-content:center;gap:4px}
.stepper button{width:36px;height:44px;flex:0 0 36px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-size:calc(20px*var(--fs));padding:0}
.stepper input{width:54px;min-width:0;height:50px;text-align:center;font-size:calc(24px*var(--fs));font-weight:800;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:0}
.sum{font-size:calc(30px*var(--fs));font-weight:900;color:var(--pri)}
.holes{display:grid;grid-template-columns:repeat(9,1fr) 1.35fr;gap:4px;margin-top:8px}
.picker{position:fixed;left:0;right:0;bottom:0;z-index:70;background:var(--card);border-top:3px solid var(--pri);border-radius:18px 18px 0 0;padding:12px 14px calc(14px + env(safe-area-inset-bottom));box-shadow:0 -8px 24px rgba(0,0,0,.3);max-width:720px;margin:0 auto}
.picker .pk-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.picker button.v{min-height:58px;border-radius:12px;border:1px solid var(--line);background:var(--bg);font-size:calc(20px*var(--fs));font-weight:800;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.picker button.v small{font-size:calc(11px*var(--fs));font-weight:600;color:var(--sub);margin-top:2px}
.picker button.v.par{border:2px solid var(--pri)}
.picker button.v.on{background:var(--pri);color:var(--pri-ink);border-color:var(--pri)}
.picker button.v.on small{color:var(--pri-ink)}
.pk-open .sheet,.pk-open .wrap{padding-bottom:55vh}   /* 고르기 창이 떠도 아래 칸까지 올려 볼 수 있게 */
.holes input[readonly]{cursor:pointer;caret-color:transparent}
.holes input.picking{outline:3px solid var(--pri);outline-offset:1px}
.holes .h.sum output{display:flex;align-items:center;justify-content:center;width:100%;height:42px;border-radius:8px;background:var(--pri-soft);color:var(--pri);font-weight:800;font-size:calc(16px*var(--fs))}
.holes .h{display:flex;flex-direction:column;align-items:center}
.holes .h span{font-size:calc(11px*var(--fs));color:var(--sub)}
.holes input{width:100%;height:42px;text-align:center;font-size:calc(17px*var(--fs));font-weight:700;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:0}
.tbl{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl tr.first td{font-weight:800}
.winner{text-align:center;padding:20px;border-radius:var(--r);background:linear-gradient(135deg,#f9a825,#ff8f00);color:#2b1d00}
.winner .nm{font-size:calc(30px*var(--fs));font-weight:900}
.save-st{font-size:calc(13px*var(--fs))}

/* 모달 */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:640px;max-height:90vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px 28px}
@media(min-width:720px){.sheet-bg{align-items:center}.sheet{border-radius:20px}}
.sheet h3{margin:0 0 6px}
.cmt{border-top:1px solid var(--line);padding:8px 0;font-size:calc(14px*var(--fs))}

/* 로그인 */
.login{max-width:420px;margin:0 auto;padding:40px 16px}
.names{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.names .btn{min-height:56px;font-size:calc(18px*var(--fs));font-weight:700}
.names .btn.on{background:var(--pri);color:var(--pri-ink);border-color:var(--pri)}
.dots{display:flex;gap:12px;justify-content:center;margin:18px 0}
.dots i{width:18px;height:18px;border-radius:50%;border:2px solid var(--pri);display:block}
.dots i.f{background:var(--pri)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pad button{height:60px;font-size:calc(24px*var(--fs));font-weight:700;border-radius:14px;border:1px solid var(--line);background:var(--card)}

/* 토스트 */
.toast{position:fixed;left:50%;bottom:calc(90px*var(--fs));transform:translateX(-50%);background:#222;color:#fff;border-radius:14px;padding:12px 16px;z-index:60;display:flex;gap:12px;align-items:center;max-width:92vw;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.toast button{background:transparent;border:1px solid #fff;color:#fff;border-radius:10px;padding:6px 10px}
.sec-title{font-size:calc(19px*var(--fs));margin:10px 0 2px;padding-bottom:8px;border-bottom:2px solid var(--pri)}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:40;display:grid;grid-template-columns:repeat(5,1fr);background:var(--nav-bg);border-top:3px solid var(--nav-line);padding:4px 4px calc(4px + env(safe-area-inset-bottom));box-shadow:0 -4px 16px rgba(0,0,0,.18)}
.bnav button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:12px;font-size:calc(13px*var(--fs));font-weight:700;color:var(--sub)}
.bnav button .i{font-size:calc(22px*var(--fs));line-height:1}
.bnav button.on{background:var(--pri-soft);color:var(--pri);box-shadow:inset 0 0 0 2px var(--pri)}
.wrap{padding-bottom:calc(150px*var(--fs))}
.it{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.it.lifting{transform:scale(1.02);box-shadow:0 8px 24px rgba(0,0,0,.25)}
/* 경비 */
.cash{border:2px solid var(--pri)}
.big-num{font-size:calc(26px*var(--fs));font-weight:900;margin:4px 0}
.bar-bg{height:10px;border-radius:6px;background:var(--line);overflow:hidden;margin:6px 0}
.bar-fg{height:100%;background:var(--pri);border-radius:6px}
.bar-fg.warn{background:var(--warn)}
.seg-tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:10px 0}
.seg-tabs button{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 2px;font-weight:700;font-size:calc(14px*var(--fs));white-space:nowrap;letter-spacing:-.03em;overflow:hidden}
.seg-tabs button.on{background:var(--pri);color:var(--pri-ink);border-color:var(--pri)}
.big-btn{width:100%;min-height:54px;font-size:calc(17px*var(--fs));margin:6px 0}
.day-h{margin:14px 2px 4px;color:var(--sub);font-size:calc(14px*var(--fs))}
.exp{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin:6px 0;cursor:pointer}
.exp .ic{font-size:calc(24px*var(--fs))}
.exp .body{flex:1;min-width:0}
.exp .ttl{font-weight:700}
.exp .amt{text-align:right;white-space:nowrap}
.chip.gold{background:#fff3cd;color:#8a5a00}
.sum3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;text-align:center;margin:8px 0}
.sum3>div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 4px}
.sum3 .lab{font-size:calc(12px*var(--fs));color:var(--sub)}
.tr{border-top:1px solid var(--line);padding:10px 0;margin-top:6px}
.tr .amt-big{font-size:calc(22px*var(--fs));font-weight:900;color:var(--pri);margin:2px 0 6px}
.mrow{display:flex;justify-content:space-between;gap:10px;border-top:1px solid var(--line);padding:10px 0;margin-top:6px}
.mrow .bal{text-align:right;font-weight:800;white-space:nowrap}
.bal.good{color:var(--good)} .bal.bad{color:var(--bad)}
.thanks{background:linear-gradient(135deg,rgba(255,193,7,.12),transparent)}
.cat{display:grid;grid-template-columns:7.5em 1fr auto;gap:8px;align-items:center;margin-top:6px;font-size:calc(14px*var(--fs))}
.fee-m{border-top:1px solid var(--line);padding:10px 0;margin-top:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}

<body>
<div id="app"><div class="login"><p class="muted">불러오는 중…</p></div></div>

<script>
(function () {
'use strict';

/* ═════════ 상태 · 통신 ═════════ */
var LS = {
  get: function (k, d) { try { var v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set: function (k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  del: function (k) { try { localStorage.removeItem(k); } catch (e) {} }
};
var S = {
  token: LS.get('trip_token', null), me: null, D: null, boot: null,
  tab: null, editMode: false, mapSel: {}, scoreRound: null, scoreFor: null,
  queue: LS.get('trip_queue', []), saveState: '', fx: null, wx: null, routes: LS.get('trip_routes', {})
};
var $app = document.getElementById('app');

/* 서버 주소: 구글 앱스 스크립트 웹앱 (GitHub Pages 화면이 여기로 요청을 보냄) */
var EXEC_URL = 'https://script.google.com/macros/s/AKfycbxugM8eolhHJVlGLwgyOweGk7cGIWNm20UClpZa0yl2LYymnH3KEV6DdAmSQ3kUSMuWcw/exec';
var APP_VER = '11.12-24';   // 화면을 고칠 때마다 올림 (정보 탭에 보임 → 폰이 새 화면인지 확인용)
var IN_GAS =!!(window.google && google.script && google.script.run);   // 앱스 스크립트 화면 또는 내 PC 미리보기

function call(action, payload) {
  return new Promise(function (resolve, reject) {
    function done(r) {
      if (r && r.ok) return resolve(r.data);
      var msg = (r && r.error) || '알 수 없는 오류';
      if (msg === 'AUTH') { logoutLocal(); return reject(new Error('다시 입장해 주세요.')); }
      reject(new Error(msg));
    }
    function fail(e) { reject(new Error('서버에 연결하지 못했습니다. (' + (e && e.message || e) + ')')); }
    if (IN_GAS) {
      google.script.run.withSuccessHandler(done).withFailureHandler(fail).api(action, payload || {}, S.token);
      return;
    }
    // text/plain 이면 브라우저가 사전 확인 요청 없이 바로 보냄 → 구글이 돌려준 JSON을 받음
    fetch(EXEC_URL, {
      method: 'POST', redirect: 'follow',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: action, payload: payload || {}, token: S.token })
    }).then(function (res) {
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.json();
    }).then(done, fail);
  });
}

/* ═════════ 도우미 ═════════ */
function esc(s) { return String(s === undefined || s === null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function el(sel, root) { return (root || document).querySelector(sel); }
function els(sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); }
function num(n) { return Number(n).toLocaleString('ko-KR'); }
function pad(n) { return (n < 10 ? '0' : '') + n; }
function toMin(t) { if (!t) return null; var p = String(t).split(':'); return Number(p[0]) * 60 + Number(p[1]); }
function fromMin(m) { m = ((m % 1440) + 1440) % 1440; return pad(Math.floor(m / 60)) + ':' + pad(m % 60); }
/* "1730", "930", "17:30", "17.30" → "17:30" (잘못되면 null) */
function parseTime(s) {
  var d = String(s || '').replace(/[^\d]/g, '');
  if (d.length === 3) d = '0' + d;
  if (d.length !== 4) return null;
  var h = Number(d.slice(0, 2)), m = Number(d.slice(2));
  if (h > 23 || m > 59) return null;
  return d.slice(0, 2) + ':' + d.slice(2);
}
function durText(min) { min = Math.round(min); var h = Math.floor(min / 60), m = min % 60; return (h ? h + '시간 ' : '') + (m || !h ? m + '분' : ''); }
var WD = ['일', '월', '화', '수', '목', '금', '토'];
function dateObj(s) { var p = s.split('-'); return new Date(Date.UTC(+p[0], +p[1] - 1, +p[2])); }
function md(s) { var d = dateObj(s); return (d.getUTCMonth() + 1) + '/' + d.getUTCDate(); }
function wd(s) { return WD[dateObj(s).getUTCDay()]; }
function addDays(s, n) { var d = dateObj(s); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); }
function dayDiff(a, b) { return Math.round((dateObj(b) - dateObj(a)) / 864e5); }
function hasLL(it) { return it && it.lat !== '' && it.lng !== '' && it.lat !== undefined && !isNaN(it.lat) && !isNaN(it.lng); }
function ll(it) { return it.lat + ',' + it.lng; }
function haversine(a, b) {
  var R = 6371, toR = Math.PI / 180;
  var dLat = (b.lat - a.lat) * toR, dLng = (b.lng - a.lng) * toR;
  var x = Math.sin(dLat / 2) * Math.sin(dLat / 2) + Math.cos(a.lat * toR) * Math.cos(b.lat * toR) * Math.sin(dLng / 2) * Math.sin(dLng / 2);
  return 2 * R * Math.asin(Math.sqrt(x));
}
function nameOf(it) { return it.display || it.place || ''; }
var TYPES = {
  flight: ['✈️', '항공'], move: ['🚐', '이동'], golf: ['⛳', '골프'], meal: ['🍽️', '식사'],
  hotel: ['🏨', '숙소'], massage: ['💆', '마사지'], shop: ['🛍️', '쇼핑'], rest: ['🌙', '휴식'], etc: ['⭐', '기타']
};
function icon(t) { return (TYPES[t] || TYPES.etc)[0]; }

/* 현지 시각 (미리보기에서는 ?now=2026-12-16T09:30 으로 바꿔 볼 수 있음) */
function localNow() {
  var q = (location.search.match(/[?&]now=([^&]+)/) || [])[1];
  if (q) { q = decodeURIComponent(q); return { date: q.slice(0, 10), min: toMin(q.slice(11, 16)) }; }
  var tz = (S.D && S.D.settings.timezone) || 'Asia/Bangkok';
  var parts = new Intl.DateTimeFormat('en-CA', { timeZone: tz, year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' }).formatToParts(new Date());
  var o = {}; parts.forEach(function (p) { o[p.type] = p.value; });
  return { date: o.year + '-' + o.month + '-' + o.day, min: Number(o.hour) * 60 + Number(o.minute) };
}

function toast(msg, action, ms) {
  var old = el('.toast'); if (old) old.remove();
  var t = document.createElement('div');
  t.className = 'toast';
  t.innerHTML = '<span>' + esc(msg) + '</span>' + (action ? '<button>' + esc(action.label) + '</button>' : '');
  document.body.appendChild(t);
  if (action) t.querySelector('button').onclick = function () { t.remove(); action.fn(); };
  setTimeout(function () { t.remove(); }, ms || (action ? 8000 : 2600));
}

function sheet(html, onMount, center) {
  removeSheets();
  var bg = document.createElement('div');
  bg.className = 'sheet-bg' + (center ? ' center' : '');
  bg.innerHTML = '<div class="sheet" role="dialog">' + html + '</div>';
  bg.addEventListener('click', function (e) { if (e.target === bg) closeSheet(); });
  document.body.appendChild(bg);
  openSheetEntry();   // 뒤로가기로 이 창을 닫을 수 있게 기록 한 칸
  els('[data-close]', bg).forEach(function (b) { b.onclick = closeSheet; });
  if (onMount) onMount(bg.firstChild);
  return bg.firstChild;
}
function removeSheets() { closePicker(); els('.sheet-bg').forEach(function (b) { b.remove(); }); }
function closeSheet() { removeSheets(); dropSheetEntry(); }
function confirmBox(msg, okLabel) {
  return new Promise(function (res) {
    var s = sheet('<h3>확인</h3><p>' + esc(msg) + '</p><div class="row" style="justify-content:flex-end"><button class="btn" data-x>취소</button><button class="btn pri" data-ok>' + esc(okLabel || '확인') + '</button></div>');
    s.querySelector('[data-x]').onclick = function () { closeSheet(); res(false); };
    s.querySelector('[data-ok]').onclick = function () { closeSheet(); res(true); };
  });
}

/* ═════════ 시작 · 로그인 ═════════ */
function start() {
  // 이미 입장한 폰: 지난번 데이터로 먼저 바로 보여 주고, 뒤에서 최신으로 갱신
  var cached = S.token && LS.get('trip_cache', null);
  if (cached && cached.settings) {
    S.D = cached; S.me = cached.me;
    S.boot = { trip_title: cached.settings.trip_title, start_date: cached.settings.start_date, end_date: cached.settings.end_date, pin_len: Number(cached.settings.pin_len || 4), members: cached.members.map(function (m) { return m.name; }) };
    S.tab = defaultTab();
    render();
    setSync('🔄 최신 내용 불러오는 중…');
    loadAll().then(function () { setSync(''); }).catch(function (e) {
      if (!S.token) return renderLogin();
      setSync('📶 연결이 안 돼 지난번 내용을 보여 주는 중');
    });
    return;
  }
  call('bootstrap').then(function (b) {
    S.boot = b;
    document.title = b.trip_title || '여행 앱';
    if (S.token) return loadAll().catch(function () { renderLogin(); });
    renderLogin();
  }).catch(function (e) {
    $app.innerHTML = '<div class="login"><h2>연결 오류</h2><p>' + esc(e.message) + '</p><button class="btn pri" onclick="location.reload()">다시 시도</button></div>';
  });
}

function renderLogin(selName) {
  var b = S.boot, pin = '';
  var last = selName || LS.get('trip_last_name', '');
  $app.innerHTML =
    '<div class="login">' +
      '<h1 class="title">' + esc(b.trip_title) + '</h1>' +
      '<p class="muted">' + md(b.start_date) + '(' + wd(b.start_date) + ') ~ ' + md(b.end_date) + '(' + wd(b.end_date) + ')</p>' +
      '<label class="lb">이름을 고르세요</label>' +
      '<div class="names">' + b.members.map(function (n) { return '<button class="btn' + (n === last ? ' on' : '') + '" data-n="' + esc(n) + '">' + esc(n) + '</button>'; }).join('') + '</div>' +
      '<label class="lb" style="margin-top:18px">PIN ' + b.pin_len + '자리</label>' +
      '<div class="dots">' + new Array(b.pin_len + 1).join('<i></i>') + '</div>' +
      '<p class="small" id="lmsg" style="text-align:center;min-height:20px;color:var(--bad)"></p>' +
      '<div class="pad">' + [1, 2, 3, 4, 5, 6, 7, 8, 9, 'C', 0, '⌫'].map(function (k) { return '<button data-k="' + k + '">' + k + '</button>'; }).join('') + '</div>' +
    '</div>';
  var name = last;
  els('[data-n]').forEach(function (bt) {
    bt.onclick = function () { name = bt.dataset.n; els('[data-n]').forEach(function (x) { x.classList.toggle('on', x === bt); }); };
  });
  function paint() { els('.dots i').forEach(function (d, i) { d.classList.toggle('f', i < pin.length); }); }
  els('[data-k]').forEach(function (bt) {
    bt.onclick = function () {
      var k = bt.dataset.k;
      if (k === 'C') pin = ''; else if (k === '⌫') pin = pin.slice(0, -1); else if (pin.length < b.pin_len) pin += k;
      paint();
      if (pin.length === b.pin_len) {
        if (!name) { el('#lmsg').textContent = '이름을 먼저 골라 주세요.'; pin = ''; paint(); return; }
        el('#lmsg').textContent = '확인 중…';
        call('login', { name: name, pin: pin }).then(function (r) {
          S.token = r.token; LS.set('trip_token', r.token); LS.set('trip_last_name', name);
          if (r.mustChange) return renderPinChange(pin, true);
          return loadAll();
        }).catch(function (e) { el('#lmsg').textContent = e.message; pin = ''; paint(); });
      }
    };
  });
}

function renderPinChange(oldPin, first) {
  var len = S.boot.pin_len;
  var html =
    '<div class="login"><h2>' + (first ? '처음 오셨네요! 내 PIN을 정해 주세요' : 'PIN 바꾸기') + '</h2>' +
    (first ? '<p class="muted">받은 임시 PIN 대신 나만 아는 숫자 ' + len + '자리로 바꿉니다. 관리자도 볼 수 없게 암호화해서 저장합니다.</p>' : '') +
    (first ? '' : '<label class="lb">현재 PIN</label><input class="inp" id="p0" inputmode="numeric" type="password" maxlength="' + len + '">') +
    '<label class="lb">새 PIN (숫자 ' + len + '자리)</label><input class="inp" id="p1" inputmode="numeric" type="password" maxlength="' + len + '">' +
    '<label class="lb">새 PIN 한 번 더</label><input class="inp" id="p2" inputmode="numeric" type="password" maxlength="' + len + '">' +
    '<p class="small" id="pmsg" style="color:var(--bad);min-height:20px"></p>' +
    '<div class="row"><button class="btn pri" id="psave" style="flex:1">저장</button>' + (first ? '' : '<button class="btn" id="pcancel">취소</button>') + '</div></div>';
  var root = first ? $app : null;
  if (first) $app.innerHTML = html; else sheet(html);
  var scope = first ? $app : el('.sheet');
  el('#psave', scope).onclick = function () {
    var o = first ? oldPin : el('#p0', scope).value, a = el('#p1', scope).value, b = el('#p2', scope).value;
    if (a !== b) { el('#pmsg', scope).textContent = '새 PIN 두 개가 다릅니다.'; return; }
    call('changePin', { oldPin: o, newPin: a }).then(function () {
      if (!first) closeSheet();
      toast('PIN을 바꿨습니다.');
      if (first) loadAll();
    }).catch(function (e) { el('#pmsg', scope).textContent = e.message; });
  };
  if (!first) el('#pcancel', scope).onclick = closeSheet;
  void root;
}

/* 글씨 크기: 보통 / 크게(기본) / 아주 크게 — 폰마다 기억 */
var FS = [1.15, 1.3, 1.45], FS_NAME = { 1.15: '보통', 1.3: '크게', 1.45: '아주 크게' };
function curFs() { var v = Number(LS.get('trip_fs2', 1.3)); return FS.indexOf(v) >= 0 ? v : 1.3; }
function setFs(v) { LS.set('trip_fs2', v); document.documentElement.style.setProperty('--fs', v); }
function fsLabel() { return FS_NAME[curFs()]; }
setFs(curFs());

function logoutLocal() { S.token = null; LS.del('trip_token'); LS.del('trip_cache'); }
function saveCache() { if (S.D) LS.set('trip_cache', S.D); }
var syncMsg = '';
function setSync(t) { syncMsg = t; updateSync(); }

/* ═════════ 데이터 ═════════ */
function loadAll() {
  return call('data').then(function (d) {
    if (S.queue.length && S.D) d.scores = S.D.scores;
    S.D = d; S.me = d.me; saveCache();
    if (!S.boot) S.boot = { trip_title: d.settings.trip_title, start_date: d.settings.start_date, end_date: d.settings.end_date, pin_len: Number(d.settings.pin_len || 4), members: d.members.map(function (m) { return m.name; }) };
    if (!S.tab) S.tab = defaultTab();
    if (el('#main') && (el('.sheet-bg') || dragState || (document.activeElement && /INPUT|TEXTAREA/.test(document.activeElement.tagName)))) { /* 입력 중이면 화면은 그대로 */ }
    else render();
    flushQueue();
    loadFx(); loadWx();
  });
}

function dates() {
  var s = S.D.settings, out = [];
  for (var d = s.start_date; d <= s.end_date; d = addDays(d, 1)) out.push(d);
  return out;
}
function itemsOf(date) { return S.D.items.filter(function (i) { return i.date === date; }).sort(function (a, b) { return a.ord - b.ord; }); }
function defaultDay() {
  var n = localNow(), ds = dates();
  return n.date >= ds[0] && n.date <= ds[ds.length - 1] ? n.date : ds[0];
}
function defaultTab() {
  var n = localNow(), ds = dates();
  if (n.date >= ds[0] && n.date <= ds[ds.length - 1]) return n.date;   // 여행 중에는 오늘 일정
  var t = LS.get('trip_tab', 'all');
  return (t === 'all' || t === 'score' || t === 'info' || t === 'money' || ds.indexOf(t) >= 0) ? t : 'all';
}
function dayLabel(date) {
  var its = itemsOf(date);
  if (its.some(function (i) { return i.type === 'golf'; })) return '골프';
  if (date === S.D.settings.start_date) return '출발';
  if (date === S.D.settings.end_date) return '도착';
  return '일정';
}

/* ═════════ 전체 화면 ═════════ */
function render() {
  var s = S.D.settings, ds = dates(), now = localNow();
  var dday = dayDiff(now.date, s.start_date), ddTxt;
  if (dday > 0) ddTxt = '출발 D-' + dday;
  else if (now.date <= s.end_date) ddTxt = '여행 ' + (1 - dday) + '일째';
  else ddTxt = '즐거운 여행이었습니다';

  var isDay = /^\d{4}-/.test(S.tab);
  var sec = isDay ? 'day' : S.tab;
  var SECS = [
    { k: 'all', i: '🏠', t: '요약' },
    { k: 'day', i: '📅', t: '일정' },
    { k: 'score', i: '⛳', t: '스코어' },
    { k: 'money', i: '💰', t: '경비' },
    { k: 'info', i: 'ℹ️', t: '정보' }
  ];
  var secTitle = { all: '여행 요약', score: '골프 스코어', money: '경비 · 정산 · 회비', info: '여행 정보' }[sec];

  $app.innerHTML =
    '<div class="wrap">' +
      '<header class="top"><div class="row between"><h1 class="title">' + esc(s.trip_title) + '</h1>' +
        '<span class="dday">' + esc(ddTxt) + '</span></div>' +
        '<div class="row between small muted"><span>' + esc(S.me.name) + ' 님' + (S.me.isAdmin ? ' · 관리자' : '') + ' <span id="sync" class="save-st"></span></span>' +
        '<button class="btn sm" data-fs title="글씨 크기 바꾸기">글씨 ' + fsLabel() + '</button></div></header>' +
      (isDay
        ? '<nav class="tabs"><div class="tabs-in">' + ds.map(function (d) {
            return '<button class="tab' + (d === S.tab ? ' on' : '') + (d === now.date ? ' today' : '') + '" data-tab="' + d + '"><span class="d">' + md(d) + ' ' + wd(d) + '</span><span class="s">' + esc(dayLabel(d)) + '</span></button>';
          }).join('') + '</div></nav>'
        : '<h2 class="sec-title">' + esc(secTitle) + '</h2>') +
      '<main id="main"></main>' +
    '</div>' +
    '<nav class="bnav">' + SECS.map(function (x) {
      return '<button class="' + (x.k === sec ? 'on' : '') + '" data-sec="' + x.k + '"><span class="i">' + x.i + '</span><span>' + x.t + '</span></button>';
    }).join('') + '</nav>';

  els('[data-tab]').forEach(function (b) { b.onclick = function () { go(b.dataset.tab); }; });
  els('[data-sec]').forEach(function (b) {
    b.onclick = function () {
      var k = b.dataset.sec;
      if (k === 'day') k = /^\d{4}-/.test(S.tab) ? S.tab : (LS.get('trip_day', null) || defaultDay());
      go(k);
    };
  });
  var fsb = el('[data-fs]');
  if (fsb) fsb.onclick = function () {
    var i = (FS.indexOf(curFs()) + 1) % FS.length;
    setFs(FS[i]); fsb.textContent = '글씨 ' + fsLabel();
    toast('글씨를 "' + fsLabel() + '"로 바꿨습니다. 누를 때마다 보통 → 크게 → 아주 크게');
  };
  renderMain();
  var on = el('.tab.on'); if (on) on.scrollIntoView({ inline: 'center', block: 'nearest' });
  updateSync();
}

function go(tab) {
  var wasDay = /^\d{4}-/.test(S.tab), isDay = /^\d{4}-/.test(tab);
  S.tab = tab; LS.set('trip_tab', tab);
  if (isDay) LS.set('trip_day', tab);
  if (wasDay !== isDay || !isDay) { render(); window.scrollTo({ top: 0 }); return; }
  els('[data-tab]').forEach(function (b) { b.classList.toggle('on', b.dataset.tab === tab); });
  var on = el('.tab.on'); if (on) on.scrollIntoView({ inline: 'center', block: 'nearest', behavior: 'smooth' });
  renderMain();
  window.scrollTo({ top: 0 });
}

function renderMain() {
  var m = el('#main'); if (!m) return;
  closePicker();
  var h;
  if (S.tab === 'all') h = viewAll();
  else if (S.tab === 'score') h = viewScore();
  else if (S.tab === 'info') h = viewInfo();
  else if (S.tab === 'money') h = viewMoney();
  else h = viewDay(S.tab);
  m.innerHTML = bahtSign(h);
  bindMain();
}
/* 화면의 "5,000바트", "200~300바트" → "฿5,000", "฿200~300" (태국 돈 표기) */
function bahtSign(h) { return h.replace(/(\d[\d,.]*(?:\s?~\s?\d[\d,.]*)?)\s?바트/g, '฿$1'); }

/* ─── 공통 카드: 항공 · 환율 ─── */
function flightCard(f) {
  var off = Number(S.D.settings.tz_offset_from_korea || 0);
  // 시각 밑 셋째 줄: 해외 공항은 한국 시각, 인천은 터미널 (양쪽 줄 수를 같게 해서 시각이 나란히 보이게)
  var term = String(f.terminal || '').replace(/^인천\s*/, '').replace(/\s*도착$/, '');
  function kr(t, code) { return code === 'ICN' ? '<div class="kr">' + esc(term || ' ') + '</div>' : '<div class="kr">한국 ' + fromMin(toMin(t) - off * 60) + '</div>'; }
  var back = f.dir.indexOf('오는') >= 0;
  return '<div class="flight' + (back ? ' back' : '') + '">' +
    '<div class="row between fhead"><span class="lbl">' + (back ? '🛬 ' : '🛫 ') + esc(f.dir) + ' · ' + md(f.date) + '(' + wd(f.date) + ')</span><span class="no">' + esc(f.airline) + ' ' + esc(f.flight) + '</span></div>' +
    '<div class="times"><div><div class="t">' + esc(f.dep) + '</div><div class="ap">' + esc(f.from) + ' ' + esc(f.from_code) + '</div>' + kr(f.dep, f.from_code) + '</div>' +
    '<div class="arrow">✈</div>' +
    '<div style="text-align:right"><div class="t">' + esc(f.arr) + '</div><div class="ap">' + esc(f.to) + ' ' + esc(f.to_code) + (f.arr_date && f.arr_date !== f.date ? ' (+1일)' : '') + '</div>' + kr(f.arr, f.to_code) + '</div></div>' +
    (f.meet ? '<div class="meta fnote"><div>⏰ ' + (f.meet_url ? '<a class="meet-link" target="_blank" href="' + esc(f.meet_url) + '">' + esc(f.meet) + ' 🗺️</a>' : esc(f.meet)) + '</div></div>' : '') +
    // 메모는 " · " 마다 줄을 나누고 앞에 그림 표시
    (f.note ? '<div class="meta fnote">' + String(f.note).split(/\s*·\s*/).filter(Boolean).map(function (t) {
      var ic = /비행/.test(t) ? '⏱️' : /위탁/.test(t) ? '🧳' : /기내/.test(t) ? '🎒' : /도착/.test(t) ? '🌅' : '•';
      return '<div>' + ic + ' ' + esc(t) + '</div>';
    }).join('') + '</div>' : '') +
  '</div>';
}
function flightsHtml(filter) {
  var fs = S.D.flights.filter(filter || function () { return true; });
  if (!fs.length) return '';
  return '<div class="flights">' + fs.map(flightCard).join('') + '</div>';
}

function fxHtml() {
  var s = S.D.settings, fx = S.fx;
  var rate = fx && fx.rate, cur = s.currency_name || s.currency;
  var head = rate
    ? '<span style="white-space:nowrap">1' + esc(cur) + ' = <b>' + rate.toFixed(2) + '원</b></span>'
    : '<span class="muted">환율을 불러오는 중…</span>';
  return '<div class="card"><div class="row between" style="flex-wrap:nowrap"><b style="white-space:nowrap">💱 환율</b>' + head + '</div>' +
    (rate ? '<div class="small muted" style="text-align:right">' + esc(fx.date) + ' 기준' + (fx.fallback ? ' (고정값)' : '') + '</div>' : '') +
    '<div class="fx-grid" style="margin-top:10px"><input class="inp" id="fxa" inputmode="decimal" placeholder="฿ THB">' +
    '<span>⇄</span><input class="inp" id="fxb" inputmode="numeric" placeholder="원"></div>' +
    '<p class="small muted" style="margin:6px 0 0;white-space:nowrap">정산 환율 1' + esc(cur) + ' = ' + esc(settleRate()) + '원</p></div>';
}

/* ─── 전체 요약 ─── */
function viewAll() {
  var html = flightsHtml() + fxHtml();
  dates().forEach(function (d) {
    var its = itemsOf(d).filter(function (i) { return i.fixed || i.type === 'golf' || i.type === 'flight' || i.type === 'hotel'; });
    html += '<div class="card daycard" data-go="' + d + '" style="cursor:pointer"><div class="row between"><b class="dhead">' + md(d) + ' (' + wd(d) + ') · ' + esc(dayLabel(d)) + '</b><span class="muted small">자세히 ›</span></div>' +
      its.map(function (i) { return '<div class="row small" style="margin-top:6px"><b style="width:46px">' + esc(i.time) + '</b><span>' + icon(i.type) + ' ' + esc(i.title) + (nameOf(i) ? ' · ' + esc(nameOf(i)) : '') + '</span></div>'; }).join('') +
      '</div>';
  });
  return html;
}

/* ─── 날짜 화면 ─── */
function routePoints(its) {
  var s = S.D.settings, base = { lat: Number(s.weather_lat), lng: Number(s.weather_lng) };
  var pts = [];
  its.forEach(function (it) {
    if (!hasLL(it)) return;
    if (haversine(base, it) > 300) return;      // 해외 출발 공항 등은 지도에서 제외
    var last = pts[pts.length - 1];
    if (last && Math.abs(last.lat - it.lat) < 1e-4 && Math.abs(last.lng - it.lng) < 1e-4) { last.ids.push(it.id); return; }
    pts.push({ lat: Number(it.lat), lng: Number(it.lng), name: nameOf(it), ids: [it.id] });
  });
  pts.forEach(function (p, i) { p.letter = String.fromCharCode(65 + i); });
  return pts;
}
/* 구글지도 임베드: 짧은 주소(maps?output=embed)는 폰 브라우저에서 막혀서, 구글이 실제로 쓰는 embed 주소를 직접 만듦 */
var EMB = 'https://www.google.com/maps/embed?origin=mfe&pb=';
function embedRoute(pts) {
  if (!pts.length) return '';
  if (pts.length === 1) return embedPlace(pts[0], 15);
  var n = pts.length * 4;
  return EMB + '!1m' + (n + 1) + '!4m' + n + pts.map(function (p) { return '!4m3!3m2!1d' + p.lat + '!2d' + p.lng; }).join('') + '!3m1!1sko!5m1!1sko';
}
function embedPlace(p, z) { return EMB + '!1m3!2m1!1s' + p.lat + ',' + p.lng + '!6i' + (z || 16) + '!3m1!1sko!5m1!1sko'; }
function gmapOpen(it) { return 'https://www.google.com/maps/search/?api=1&query=' + it.lat + ',' + it.lng; }
function gmapDir(a, b) { return 'https://www.google.com/maps/dir/?api=1&origin=' + a.lat + ',' + a.lng + '&destination=' + b.lat + ',' + b.lng + '&travelmode=driving'; }
function gmapDayRoute(pts) {
  var a = pts[0], z = pts[pts.length - 1];
  var w = pts.slice(1, -1).map(function (p) { return p.lat + ',' + p.lng; }).join('|');
  return 'https://www.google.com/maps/dir/?api=1&origin=' + a.lat + ',' + a.lng + '&destination=' + z.lat + ',' + z.lng + (w ? '&waypoints=' + encodeURIComponent(w) : '') + '&travelmode=driving';
}
function gmapNearby(it) { return 'https://www.google.com/maps/search/restaurants/@' + it.lat + ',' + it.lng + ',16z'; }

function nextCard(date) {
  var n = localNow();
  if (n.date !== date) return '';
  var its = itemsOf(date).filter(function (i) { return i.time && toMin(i.time) > n.min; });
  if (!its.length) return '';
  var nx = its[0], left = toMin(nx.time) - n.min;
  return '<div class="next' + (left <= 30 ? ' soon' : '') + '"><div style="font-size:28px">' + icon(nx.type) + '</div><div><div class="small muted">다음 일정</div>' +
    '<div class="big">' + esc(nx.time) + ' ' + esc(nx.title) + '</div><div class="small">' + (nameOf(nx) ? esc(nameOf(nx)) + ' · ' : '') + '<b>' + durText(left) + ' 남음</b></div></div></div>';
}

function wxCard(date) {
  var w = S.wx && S.wx[date];
  if (w) {
    return '<div class="card wx"><div class="ico">' + wxIcon(w.code) + '</div><div><div class="temp">' + Math.round(w.max) + '° / ' + Math.round(w.min) + '°</div>' +
      '<div class="small muted">비 올 확률 ' + (w.rain === null ? '-' : w.rain + '%') + ' · 자외선 ' + (w.uv === null ? '-' : Math.round(w.uv)) + (w.uv >= 8 ? ' (매우 높음, 선크림 필수)' : '') + '</div></div></div>';
  }
  if (!S.wx) return '';
  return '<div class="card wx"><div class="ico">🌤️</div><div><div class="small"><b>날씨 예보는 약 2주 전부터 보입니다.</b></div>' +
    '<div class="small muted">12월 파타야는 건기로 맑은 날이 많고, 보통 낮 30℃ 안팎 · 밤 23℃ 안팎입니다.</div></div></div>';
}
function wxIcon(c) { c = Number(c); if (c === 0) return '☀️'; if (c <= 2) return '🌤️'; if (c === 3) return '☁️'; if (c <= 48) return '🌫️'; if (c <= 67 || (c >= 80 && c <= 82)) return '🌧️'; if (c >= 95) return '⛈️'; return '🌦️'; }

function viewDay(date) {
  var its = itemsOf(date), pts = routePoints(its);
  var letterOf = {}; pts.forEach(function (p) { p.ids.forEach(function (id) { letterOf[id] = p.letter; }); });
  var s = S.D.settings;
  var fl = '';
  if (date === s.start_date) fl = flightsHtml(function (f) { return f.date === date; });
  S.D.flights.forEach(function (f) { if (f.date === date && date !== s.start_date) fl = flightsHtml(function (g) { return g === f; }); });
  if (date === s.end_date) fl = flightsHtml(function (f) { return f.arr_date === date; });

  var list = '';
  its.forEach(function (it, i) {
    if (i > 0) list += segHtml(its, i);
    list += itemHtml(it, letterOf[it.id]);
  });
  if (!its.length) list = '<p class="muted">일정이 없습니다.</p>';

  var sel = S.mapSel[date];
  var selPt = pts.filter(function (p) { return p.letter === sel; })[0];
  var map = pts.length
    ? '<div class="map-box"><div class="map-head"><b>🗺️ 오늘 동선</b><a class="small" target="_blank" href="' + esc(pts.length > 1 ? gmapDayRoute(pts) : gmapOpen(pts[0])) + '">구글지도 앱으로 ›</a></div>' +
      '<iframe referrerpolicy="no-referrer-when-downgrade" src="' + esc(selPt ? embedPlace(selPt) : embedRoute(pts)) + '" title="오늘 지도"></iframe>' +
      '<div class="pts"><button class="pt' + (!selPt ? ' on' : '') + '" data-pt="">전체 동선</button>' +
      pts.map(function (p) { return '<button class="pt' + (p === selPt ? ' on' : '') + '" data-pt="' + p.letter + '"><b>' + p.letter + '</b> ' + esc(p.name) + '</button>'; }).join('') + '</div>' +
      (pts.length > 1 ? '<div style="padding:0 10px 12px"><a class="btn sm" target="_blank" href="' + esc(gmapDayRoute(pts)) + '">🧭 오늘 경로 전체 보기 (구글지도)</a></div>' : '') +
      '</div>'
    : '';

  var adminTip = S.me.isAdmin ? '<p class="small muted" style="margin:6px 2px">✋ 관리자: 일정을 <b>꾹 누르면</b> 끌어서 순서를 바꿀 수 있고, 위 날짜 탭에 놓으면 다른 날로 옮겨집니다. 눌러서 열면 ✏️ 수정.</p>' : '';
  var addBtn = S.me.isAdmin ? '<button class="btn add-item" data-act="add">＋ 이 날에 일정 추가</button>' : '';

  return nextCard(date) + fl + wxCard(date) +
    '<div class="day-grid"><div class="map-col">' + map + '</div>' +
    '<div class="list-col">' + adminTip + '<ul class="tl" id="tl">' + list + '</ul>' + addBtn + '</div></div>';
}

function itemHtml(it, letter) {
  var changed = it.updated_at && isRecent(it.updated_at);
  var cmts = S.D.comments.filter(function (c) { return c.item_id === it.id; }).length;
  return '<li class="it ty-' + esc(it.type) + (it.fixed ? ' fixed' : '') + (changed ? ' changed' : '') + '" data-id="' + esc(it.id) + '">' +
    '<div class="tm">' + esc(it.time || '--:--') + (it.fixed ? '<div class="lock">🔒 고정</div>' : '') + '</div>' +
    '<div class="bar"></div>' +
    '<div class="body" data-open="' + esc(it.id) + '">' +
      '<div class="ttl">' + icon(it.type) + ' ' + esc(it.title) + '</div>' +
      (nameOf(it) ? '<div class="plc">📍 ' + esc(nameOf(it)) + '</div>' : '') +
      (it.memo ? '<div class="memo">' + esc(it.memo) + '</div>' : '') +
      '<div class="row" style="gap:6px;margin-top:2px">' + (changed ? '<span class="chip warn">변경됨</span>' : '') + (cmts ? '<span class="chip">💬 ' + cmts + '</span>' : '') + '</div>' +
    '</div>' +
    '<div class="side">' + (letter ? '<span class="letter">' + letter + '</span>' : '') +
      '</div>' +
  '</li>';
}
function isRecent(at) {
  var t = Date.parse(String(at).replace(' ', 'T') + ':00+07:00');
  return isFinite(t) && Date.now() - t < 864e5;
}

/* 이동 거리 · 시간 */
function segHtml(its, i) {
  var a = null;
  for (var k = i - 1; k >= 0; k--) if (hasLL(its[k])) { a = its[k]; break; }
  var b = its[i];
  if (!a || !hasLL(b)) return '';
  if (Math.abs(a.lat - b.lat) < 1e-4 && Math.abs(a.lng - b.lng) < 1e-4) return '';
  if (haversine(a, b) > 300) return '';
  var key = ll(a) + '>' + ll(b), r = S.routes[key];
  var prev = its[i - 1];
  var txt, late = false, slack = null;
  if (r) {
    txt = '🚗 ' + (r.km < 10 ? r.km.toFixed(1) : Math.round(r.km)) + 'km · 약 ' + durText(r.min);
    if (prev.time && b.time) {
      slack = toMin(b.time) - toMin(prev.time);
      if (prev === a && slack < r.min) late = true;
    }
  } else {
    txt = '🚗 거리 계산 중…';
    fetchRoute(a, b);
  }
  return '<li class="seg' + (late ? ' late' : '') + '"><span>' + txt + '</span>' +
    '<a class="live" target="_blank" href="' + esc(gmapDir(a, b)) + '">🚦 실시간 확인하기</a>' +
    (late ? '<span>⚠️ 이동 ' + durText(r.min) + ' 필요, 여유 ' + durText(Math.max(0, slack)) + '</span>' +
      (S.me.isAdmin && !b.fixed ? ' <button class="btn sm" data-shift="' + esc(b.id) + '" data-min="' + Math.ceil((r.min - slack) / 5) * 5 + '">뒤 일정 ' + Math.ceil((r.min - slack) / 5) * 5 + '분 미루기</button>' : '') : '') +
    '</li>';
}
var routeBusy = {};
function fetchRoute(a, b) {
  var key = ll(a) + '>' + ll(b);
  if (routeBusy[key]) return;
  routeBusy[key] = 1;
  fetch('https://router.project-osrm.org/route/v1/driving/' + a.lng + ',' + a.lat + ';' + b.lng + ',' + b.lat + '?overview=false')
    .then(function (r) { return r.json(); })
    .then(function (j) {
      if (!j.routes || !j.routes[0]) throw new Error('no route');
      S.routes[key] = { km: j.routes[0].distance / 1000, min: Math.max(1, Math.round(j.routes[0].duration / 60)) };
      LS.set('trip_routes', S.routes);
      if (S.tab && /^\d{4}-/.test(S.tab) && !el('.sheet-bg') && !dragState) renderMain();
    })
    .catch(function () {
      var km = haversine(a, b) * 1.3;          // 경로를 못 받으면 직선거리로 대략 추정
      S.routes[key] = { km: km, min: Math.round(km / 40 * 60), approx: true };
      if (S.tab && /^\d{4}-/.test(S.tab) && !el('.sheet-bg') && !dragState) renderMain();
    });
}

/* ─── 스코어 ─── */
function rounds() { return S.D.rounds.slice().sort(function (a, b) { return a.date < b.date ? -1 : 1; }); }
function scoreOf(rid, name) { return S.D.scores.filter(function (s) { return s.round_id === rid && s.member === name; })[0]; }

  return { f: f, b: b, t: (f || 0) + (b || 0), done: f !== null && b !== null && (sc.mode !== 'holes' || filled(parseHoles(sc)) === 18), holes: sc.mode === 'holes' ? filled(parseHoles(sc)) : null };
}

  if (!S.scoreRound) S.scoreRound = defaultRound();

    '<div class="card scan"><b>📋 스코어카드 사진으로 입력</b><div class="small muted" style="margin:4px 0 8px">종이 스코어카드를 찍으면 4명 점수를 읽어서 채워 줍니다. 저장 전에 확인할 수 있어요.</div>' +
      '<div class="scan-btns"><label class="btn pri">📷 카드 찍기<input type="file" accept="image/*" capture="environment" data-scan hidden></label>' +

function scoreTables(r) {
  var members = S.D.members.map(function (m) { return m.name; });
  // 라운드 순위
  var rows = members.map(function (n) { var s = scoreOf(r.round_id, n); return { n: n, s: s, t: totalOf(s) }; });
  var ranked = rows.filter(function (x) { return x.t && x.t.done; }).sort(function (a, b) { return a.t.t - b.t.t; });
  var best = ranked.length ? ranked[0].t.t : null;
  var table =
    '<div class="card"><b>📋 ' + esc(r.course) + ' · ' + md(r.date) + ' 순위</b><div style="overflow-x:auto"><table class="tbl" style="margin-top:6px"><tr><th>이름</th><th>전반</th><th>후반</th><th>합계</th><th></th></tr>' +
    rows.sort(function (a, b) { return (a.t && a.t.done ? a.t.t : 999) - (b.t && b.t.done ? b.t.t : 999); }).map(function (x) {
      var t = x.t;
      var crown = t && t.done && t.t === best ? ' 👑' : '';
      return '<tr' + (crown ? ' class="first"' : '') + '><td>' + esc(x.n) + crown + '</td><td>' + (t && t.f !== null ? t.f : '-') + '</td><td>' + (t && t.b !== null ? t.b : '-') + '</td><td><b>' + (t && (t.f !== null || t.b !== null) ? t.t : '-') + '</b>' + (t && t.holes !== null && t.holes < 18 ? '<div class="small muted">' + t.holes + '홀</div>' : '') + '</td>' +
        '<td>' + (x.n !== S.me.name ? '<button class="btn sm ghost" data-for="' + esc(x.n) + '">대신 입력</button>' : '') + '</td></tr>';
    }).join('') + '</table></div></div>';
  return table + overallHtml();
}
function refreshTables() {
  var box = el('#sc-tables'); if (!box) return;
  var r = S.D.rounds.filter(function (x) { return x.round_id === S.scoreRound; })[0]; if (!r) return;
  box.innerHTML = scoreTables(r);
  bindFor(box);
}

function stepper(key, v) {
  return '<div class="stepper"><button data-step="' + key + '" data-d="-1">−</button><input inputmode="numeric" maxlength="2" data-half="' + key + '" value="' + (v === null || v === undefined ? '' : v) + '"><button data-step="' + key + '" data-d="1">＋</button></div>';
}

function overallHtml() {
  var rs = rounds(), members = S.D.members.map(function (m) { return m.name; });
  var rows = members.map(function (n) {
    var per = rs.map(function (r) { var t = totalOf(scoreOf(r.round_id, n)); return t && t.done ? t.t : null; });
    var done = per.filter(function (x) { return x !== null; });
    var sum = done.reduce(function (a, b) { return a + b; }, 0);
    return { n: n, per: per, cnt: done.length, sum: sum, avg: done.length ? sum / done.length : null, best: done.length ? Math.min.apply(null, done) : null };
  });
  var maxCnt = Math.max.apply(null, rows.map(function (x) { return x.cnt; }));
  rows.sort(function (a, b) { if (b.cnt !== a.cnt) return b.cnt - a.cnt; return a.sum - b.sum; });
  var allDone = maxCnt === rs.length && rows.every(function (x) { return x.cnt === rs.length; });
  var winner = allDone && rows.length ? rows[0] : null;
  return (winner ? '<div class="winner" style="margin:12px 0"><div>🏆 최종 우승</div><div class="nm">' + esc(winner.n) + '</div><div>' + rs.length + '라운드 합계 ' + winner.sum + '타 · 평균 ' + winner.avg.toFixed(1) + '</div></div>' : '') +
    '<div class="card"><b>🏅 전체 순위</b><div style="overflow-x:auto"><table class="tbl" style="margin-top:6px"><tr><th>순위</th><th>이름</th>' + rs.map(function (r) { return '<th>' + md(r.date) + '</th>'; }).join('') + '<th>합계</th><th>평균</th><th>베스트</th></tr>' +
    rows.map(function (x, i) {
      return '<tr' + (i === 0 && x.cnt ? ' class="first"' : '') + '><td>' + (x.cnt ? (i + 1) : '-') + '</td><td>' + esc(x.n) + '</td>' + x.per.map(function (p) { return '<td>' + (p === null ? '-' : p) + '</td>'; }).join('') +
        '<td><b>' + (x.cnt ? x.sum : '-') + '</b></td><td>' + (x.avg === null ? '-' : x.avg.toFixed(1)) + '</td><td>' + (x.best === null ? '-' : x.best) + '</td></tr>';
    }).join('') + '</table></div><p class="small muted">끝난 라운드 수가 많은 사람 → 합계가 적은 사람 순. 라운드가 덜 끝난 사람은 아래쪽에 표시됩니다.</p></div>';
}

/* 스코어 저장: 바꿀 때마다 자동 저장, 실패하면 폰에 보관 후 재전송 */
var saveTimer = null;
function currentScore() {
  var r = S.scoreRound, who = S.scoreFor || S.me.name;
  var sc = scoreOf(r, who);
  if (!sc) { sc = { round_id: r, member: who, mode: LS.get('trip_mode', 'half'), front: '', back: '', holes: '' }; S.D.scores.push(sc); }
  return sc;
}
function queueSave(sc) {
  var payload = { round_id: sc.round_id, member: sc.member, mode: sc.mode, front: sc.front, back: sc.back, holes: parseHoles(sc) };
  S.queue = S.queue.filter(function (q) { return !(q.round_id === payload.round_id && q.member === payload.member); });
  S.queue.push(payload); LS.set('trip_queue', S.queue);

    S.queue.shift(); LS.set('trip_queue', S.queue);

    setSave('📶 연결 대기 중 (' + S.queue.length + '건 폰에 보관) — 연결되면 자동 전송');

function setSave(t) { S.saveState = t; var e = el('#sst'); if (e) e.textContent = t; updateSync(); }
function updateSync() { var e = el('#sync'); if (e) e.textContent = S.queue.length ? '📶 미전송 ' + S.queue.length + '건' : syncMsg; }
window.addEventListener('online', flushQueue);

function refreshTotals(sc) {
  var t = totalOf(sc);
  var s = el('#sum'); if (s) s.textContent = t && (t.f !== null || t.b !== null) ? t.t : '-';
  if (el('#hf')) el('#hf').textContent = t.f === null ? '-' : t.f;

}
function sumHoles(h, a, b) { var s = 0, any = false; for (var i = a; i < b; i++) if (h[i] !== '' && h[i] !== undefined) { s += Number(h[i]); any = true; } return any ? s : ''; }

/* ═════════ 스코어카드 사진 인식 ═════════ */
function scanScorecard(file) {
  var rid = S.scoreRound, r = S.D.rounds.filter(function (x) { return x.round_id === rid; })[0];
  var sh = sheet('<h3>📋 스코어카드 읽는 중… <span id="sc-sec" class="small muted"></span></h3><p class="small muted">20~40초 걸릴 수 있습니다. 창을 닫지 말아 주세요.</p><div id="sc-img"></div><p class="small" id="sc-st"></p>');
  var shot, t0 = Date.now();
  var tick = setInterval(function () { var e = el('#sc-sec', sh); if (!e || !document.body.contains(sh)) return clearInterval(tick); e.textContent = Math.round((Date.now() - t0) / 1000) + '초'; }, 1000);
  shrinkImage(file, 2000, 0.85).then(function (dataUrl) {
    shot = dataUrl;
    el('#sc-img', sh).innerHTML = '<img class="rimg" src="' + dataUrl + '">';
    var up = call('uploadReceipt', { dataUrl: dataUrl, kind: 'scorecard' });
    var rec = call('recognize', { kind: 'scorecard', dataUrl: dataUrl }).then(function (x) { return x.result; }, function (e) { return { _err: e.message }; });
    return Promise.all([up, rec]);
  }).then(function (both) {
    clearInterval(tick);
    var res = both[1] || {};
    var pars = Array.isArray(res.pars) && res.pars.length === 18 ? res.pars : null;
    call('addCard', { round_id: rid, id: both[0].id, pars: pars }).then(function (x) { S.D.rounds = x.rounds; saveCache(); }).catch(function () {});
    if (res._err) {
      el('#sc-st', sh).textContent = res._err === 'NO_KEY' ? '사진은 저장했지만 자동 인식이 아직 설정 전입니다. 점수는 직접 입력해 주세요.' : '사진은 저장했지만 점수를 읽지 못했습니다: ' + res._err;
      return;
    }
    reviewScorecard(res, r, shot);
  }).catch(function (e) { clearInterval(tick); el('#sc-st', sh).textContent = '실패: ' + e.message; });
}

function reviewScorecard(res, r, shot) {
  var names = memberNames();
  var players = (res.players || []).map(function (p) { var raw = Array.isArray(p.raw) ? p.raw : p.holes; return Object.assign({}, p, { raw: Array.isArray(raw) ? holes18(raw) : null }); })
    .filter(function (p) { return p.raw; });
  if (!players.length) { sheet('<h3>점수를 찾지 못했습니다</h3><p>사진이 흐리거나 잘렸을 수 있습니다. 스코어카드 전체가 나오게 다시 찍어 주세요.</p><button class="btn pri" data-close>확인</button>'); return; }
  // 파: 카드에서 읽은 값 → 라운드에 저장된 값 → 빈칸
  var cardPars = Array.isArray(res.pars) && res.pars.length === 18 ? res.pars.map(Number) : null;
  var savedPars = String(r.pars || '').split(/[,\s]+/).filter(Boolean).map(Number);
  var pars = cardPars || (savedPars.length === 18 ? savedPars : ['', '', '', '', '', '', '', '', '', '', '', '', '', '', '', '', '', '']);
  // 적는 방식: 인식 결과 → 숫자 모양으로 추정
  var allRaw = [];
  players.forEach(function (p) { p.raw.forEach(function (v) { if (v !== null && v !== '' && v !== undefined) allRaw.push(Number(v)); }); });
  var guessRel = allRaw.some(function (v) { return v <= 0; }) || (allRaw.length && allRaw.reduce(function (a, b) { return a + b; }, 0) / allRaw.length < 2.6);
  var st = { mode: res.notation === 'relative' || res.notation === 'strokes' ? res.notation : (guessRel ? 'relative' : 'strokes'), parsEdited: false };

  var html = '<h3>📋 읽은 점수 확인 · ' + esc(r.course) + '</h3>' +
    '<label class="lb">카드에 적은 방식</label><div class="chips" id="rv-mode">' +
      '<button class="pick" data-v="strokes">타수 그대로 (파4 → 4, 보기 → 5)</button>' +
      '<button class="pick" data-v="relative">파 기준 ± (파 0, 보기 +1, 버디 −1)</button></div>' +
    '<p class="small muted" id="rv-mode-help"></p>' +
    '<div class="card" id="rv-pars"><b>⛳ 홀별 파(PAR)</b> <span class="small muted" id="rv-pars-help"></span>' +
      '<div class="holes">' + pars.map(function (v, k) { return (k === 9 ? '</div><div class="holes">' : '') + '<div class="h"><span>' + (k + 1) + '</span><input readonly maxlength="1" class="' + (cardPars ? 'auto' : '') + '" data-par="' + k + '" value="' + (v || '') + '"></div>' +
        (k === 8 ? sumCell('전반', 'data-parsum="f"') : k === 17 ? sumCell('후반', 'data-parsum="b"') : ''); }).join('') + '</div>' +

    (shot ? '<details><summary class="small">찍은 사진 보기</summary><img class="rimg" src="' + shot + '"></details>' : '');
  players.forEach(function (p, i) {
    var h = p.raw.slice(0, 18); while (h.length < 18) h.push(null);
    var mem = names.indexOf(p.member) >= 0 ? p.member : '';

      '<select class="inp" data-plm style="width:auto;min-height:40px">' + ['<option value="">(회원 선택)</option>'].concat(names.map(function (n) { return '<option' + (n === mem ? ' selected' : '') + '>' + esc(n) + '</option>'; })).join('') + '</select></div>' +
      '<div class="holes">' + h.map(function (v, k) {
        var shown = v === null || v === undefined ? '' : (Number(v) > 0 && st.mode === 'relative' ? '+' + v : String(v));
        return (k === 9 ? '</div><div class="holes">' : '') + '<div class="h"><span>' + (k + 1) + '</span><input readonly maxlength="3" class="' + (shown !== '' ? 'auto' : '') + '" data-ph="' + k + '" value="' + shown + '"></div>' +
          (k === 8 ? sumCell('전반', 'data-psum="f"') : k === 17 ? sumCell('후반', 'data-psum="b"') : '');
      }).join('') + '</div>' +
      '<div class="small" data-pchk style="margin-top:6px"></div></div>';
  });
  html += '<p class="small" id="rv-msg" style="color:var(--bad);min-height:18px"></p><div class="row" style="justify-content:flex-end"><button class="btn" id="rv-x">취소</button><button class="btn pri" id="rv-ok">이대로 저장</button></div>';
  var sh = sheet(html);

  function parVals() { return els('[data-par]', sh).map(function (x) { var n = parseInt(x.value, 10); return n >= 3 && n <= 6 ? n : null; }); }
  function rawVals(card) {
    return els('[data-ph]', card).map(function (x) {
      var t = x.value.replace(/[○oO]/g, '0').replace(/^-$/, '0').replace(/[^\d+-]/g, '');

    var rf = sumN(raw, 0, 9), rb = sumN(raw, 9, 18), rt = (rf || 0) + (rb || 0);
    var msg = '타수 → 전반 <b>' + (f === null ? '-' : f) + '</b> · 후반 <b>' + (b === null ? '-' : b) + '</b> · 합계 <b>' + t + '</b>';
    if (st.mode === 'relative') msg += ' <span class="muted">(파 대비 ' + (rt > 0 ? '+' : '') + rt + ')</span>';
    // 카드에 적힌 합계는 타수일 수도, ±일 수도 있으니 둘 중 하나와 맞으면 통과
    function same(w, a, b2) { return w === null || w === undefined || w === '' || Number(w) === a || Number(w) === b2 || Math.abs(Number(w)) === Math.abs(b2); }
    var bad = [];
    if (!same(p.out, f, rf)) bad.push('카드 전반 ' + p.out);
    if (!same(p.in, b, rb)) bad.push('카드 후반 ' + p.in);

    card.querySelector('[data-pchk]').innerHTML = msg + (needPar ? ' <span style="color:var(--bad)">⚠️ 파가 빈 홀이 있어 계산할 수 없습니다</span>' : '') +
      (bad.length ? ' <span style="color:var(--bad)">⚠️ ' + bad.join(', ') + '와 다름</span>' : '') + (empty ? ' <span style="color:var(--warn)">빈 칸 ' + empty + '개</span>' : '');
    card.querySelector('[data-psum="f"]').textContent = f === null ? '-' : f;
    card.querySelector('[data-psum="b"]').textContent = b === null ? '-' : b;
    card.classList.toggle('sum-bad', bad.length > 0 || needPar);
    return { strokes: s, needPar: needPar };
  }
  function refresh() {
    els('#rv-mode .pick', sh).forEach(function (b) { b.classList.toggle('on', b.dataset.v === st.mode); });
    el('#rv-mode-help', sh).textContent = st.mode === 'relative'
      ? '파 기준으로 적은 카드입니다. 아래 홀별 파에 더해서 실제 타수로 바꿔 저장합니다. (파 = 0 또는 -, 보기 = 1, 버디 = -1)'
      : '적힌 숫자를 그대로 타수로 저장합니다.';
    var pv = parVals(), filledPars = pv.filter(Boolean).length;

      '</div></div><div class="bal good">' + baht(c.support[n]) + '<br><span class="small">' + wonShort(c.support[n] * c.rate) + '</span></div></div>';

  }).join('') +
  '<div class="small muted" style="margin-top:8px">날짜별: ' + Object.keys(c.byDay).sort().map(function (d) { return md(d) + ' ' + baht(c.byDay[d]); }).join(' · ') + '</div></div>';

  // 확인 · 출력
  html += '<div class="card"><b>✅ 정산 확인</b><p class="small muted">내용을 확인했으면 눌러 주세요. 4명 모두 누르면 정산 확정입니다. 이상한 지출은 그 지출을 눌러 메모를 남겨 주세요.</p>' +
    '<div class="row wrap-row">' + names.map(function (n) { return '<span class="chip' + (settleOn('confirm', n) ? '' : ' warn') + '">' + esc(n) + (settleOn('confirm', n) ? ' ✓' : ' …') + '</span>'; }).join('') + '</div>' +
    '<button class="btn ' + (settleOn('confirm', S.me.name) ? '' : 'pri ') + 'big-btn" data-mark="confirm" data-on="' + (settleOn('confirm', S.me.name) ? '' : '1') + '">' + (settleOn('confirm', S.me.name) ? '확인 취소' : '확인했어요') + '</button>' +
    (allOk ? '<p class="chip" style="margin-top:8px">🎉 4명 모두 확인 — 정산 확정</p>' : '') + '</div>' +
    '<div class="row wrap-row no-print"><button class="btn" data-act="exp-csv">📊 엑셀(CSV) 받기</button><button class="btn" data-act="exp-print">🖨️ 인쇄 · PDF</button></div>';
  return html;
}

/* 회비 납부 현황 */
function feeStats() {
  var s = S.D.settings, names = memberNames();
  var fees = S.D.fees || [], uses = S.D.feeUses || [];
  var paidBy = {}; names.forEach(function (n) { paidBy[n] = 0; });
  fees.forEach(function (f) { paidBy[f.member] = (paidBy[f.member] || 0) + Number(f.amount || 0); });
  var paidTotal = names.reduce(function (a, n) { return a + paidBy[n]; }, 0);
  var useTotal = uses.reduce(function (a, u) { return a + Number(u.amount || 0); }, 0);
  var interest = Number(s.fee_interest || 0);
  return { names: names, fees: fees, uses: uses, paidBy: paidBy, paidTotal: paidTotal, useTotal: useTotal, interest: interest, balance: paidTotal + interest - useTotal };
}
function viewFee() {
  var s = S.D.settings, target = Number(s.fee_target || 0), F = feeStats(), names = F.names;
  var fees = F.fees, uses = F.uses, paidBy = F.paidBy, paidTotal = F.paidTotal, useTotal = F.useTotal;
  var interest = F.interest, balance = F.balance;
  var unpaid = names.reduce(function (a, n) { return a + Math.max(0, target - paidBy[n]); }, 0);
  var html =
    '<div class="sum3"><div><div class="lab">총 납부</div><b>' + wonShort(paidTotal) + '</b><div class="small muted">목표 ' + wonShort(target * names.length) + '</div></div>' +
    '<div><div class="lab">사용</div><b>' + wonShort(useTotal) + '</b><div class="small muted">이자 +' + num(interest) + '원</div></div>' +
    '<div><div class="lab">통장 잔고</div><b>' + wonShort(balance) + '</b><div class="small muted">' + esc(s.fee_asof || '') + ' 기준</div></div></div>' +
    (unpaid ? '<p class="small" style="color:var(--warn)">아직 들어오지 않은 회비 ' + won(unpaid) + ' — 다 들어오면 잔고 ' + won(balance + unpaid) + '</p>' : '<p class="small" style="color:var(--good)">✅ 모두 완납</p>');
  html += '<div class="card"><b>👥 회원별 납부 현황</b> <span class="small muted">(1인 목표 ' + won(target) + ')</span>';
  names.forEach(function (n) {
    var p = paidBy[n], left = target - p, pct = target ? Math.min(100, p / target * 100) : 0;
    var rows = fees.filter(function (f) { return f.member === n; });
    html += '<div class="fee-m"><div class="row between"><b>' + esc(n) + '</b>' +
      (left > 0 ? '<span class="chip bad">' + won(left) + ' 남음</span>' : '<span class="chip">✅ 완납</span>') + '</div>' +
      '<div class="bar-bg"><div class="bar-fg' + (left > 0 ? ' warn' : '') + '" style="width:' + pct + '%"></div></div>' +
      '<div class="fee-tot"><span>총 납부</span><span>' + won(p) + '</span></div>' +
      rows.slice().sort(function (a, b) { return String(a.date).localeCompare(String(b.date)); }).map(function (f) {
        var d = String(f.date), lab = /^\d{4}$/.test(d) ? d + '년' : d;
        return '<div class="fee-y"><span>' + esc(lab) + (S.me.isAdmin ? ' <a href="#" data-feedel="in:' + esc(f.id) + '">✕</a>' : '') + '</span><span>' + won(f.amount) + '</span></div>';
      }).join('') + '</div>';
  });
  html += (S.me.isAdmin ? '<button class="btn sm" data-act="fee-in" style="margin-top:8px">＋ 입금 기록 (관리자)</button>' : '') + '</div>';
  html += '<div class="card"><b>📤 회비 사용 내역</b>' + uses.map(function (u) {
    return '<div class="mrow"><div><b>' + esc(u.title) + '</b><div class="small muted">' + esc(u.date) + ' · ' + esc(u.by) + (u.memo ? ' · ' + esc(u.memo) : '') + (S.me.isAdmin ? ' <a href="#" data-feedel="use:' + esc(u.id) + '">✕</a>' : '') + '</div></div><div class="bal">' + won(u.amount) + '</div></div>';
  }).join('') + (S.me.isAdmin ? '<button class="btn sm" data-act="fee-use" style="margin-top:8px">＋ 사용 기록 (관리자)</button>' : '') +
  '<p class="small muted">환전한 바트(공금)는 여행에서 쓰고, 남은 공금은 돌아와서 회비로 다시 넣으면 됩니다.</p></div>';
  return html;
}

/* 지출 적기 · 고치기 */

    '<label class="lb">누가 냈나요</label><div id="x-payer"><button class="pick wide' + (st.payer === '공금' ? ' on' : '') + '" data-v="공금">💰 공금으로 냈어요</button>' +
      '<div class="grid4" style="margin-top:6px">' + names.map(function (n) { return '<button class="pick' + (n === st.payer ? ' on' : '') + '" data-v="' + esc(n) + '">' + esc(n) + '</button>'; }).join('') + '</div></div>' +
    '<div id="x-kind-box"><label class="lb">어떻게 나눌까요</label><div class="grid3" id="x-kind">' +
      [['공동', '👥', '다 같이'], ['지원', '🙏', '지원(쏨)'], ['일부지원', '🙏', '일부 지원']].map(function (k) { return '<button class="pick tile' + (k[0] === st.kind ? ' on' : '') + '" data-v="' + k[0] + '"><span class="ti">' + k[1] + '</span><span>' + k[2] + '</span></button>'; }).join('') + '</div>' +
    '<p class="small muted" id="x-kind-help"></p></div>' + '<p class="small muted" id="x-cash-note">💰 공금은 다 같이 낸 돈이라 회원끼리 정산하지 않습니다.</p>' +
    '<div id="x-sup-box"><label class="lb">지원한 금액 (바트) — 나머지만 나눕니다</label><input class="inp money" id="x-sup" inputmode="decimal" value="' + esc(e.support_thb) + '"></div>' +
    '<div id="x-parts-box"><label class="lb">함께한 사람 (빠진 사람은 눌러서 해제)</label><div class="grid4" id="x-parts">' + names.map(function (n) { return '<button class="pick' + (st.parts.indexOf(n) >= 0 ? ' on' : '') + '" data-v="' + esc(n) + '">' + esc(n) + '</button>'; }).join('') + '</div></div>' +
    '<div class="row" style="margin-top:8px"><div style="flex:1"><label class="lb">날짜</label><select class="inp" id="x-date">' + ds.map(function (d) { return '<option value="' + d + '"' + (d === e.date ? ' selected' : '') + '>' + md(d) + '(' + wd(d) + ')</option>'; }).join('') + '</select></div></div>' +
    '<label class="lb">메모</label><textarea class="inp" id="x-memo" rows="2">' + esc(e.memo) + '</textarea>' +
    (e.created_by ? '<p class="small muted">적은 사람: ' + esc(e.created_by) + (e.updated_at ? ' · ' + esc(e.updated_at) : '') + '</p>' : '') +
    '<p class="small" id="x-msg" style="color:var(--bad);min-height:18px"></p>' +
    '<div class="row between">' + (!isNew && canEdit ? '<button class="btn bad" id="x-del">삭제</button>' : '<span></span>') +
    '<div class="row"><button class="btn" id="x-x">' + (canEdit ? '취소' : '닫기') + '</button>' + (canEdit ? '<button class="btn pri" id="x-ok">저장</button>' : '') + '</div></div>';
  var sh = sheet(html);
  var tIn = el('#x-thb', sh), kIn = el('#x-krw', sh);
  tIn.oninput = function () { st.inCur = 'THB'; var v = parseFloat(tIn.value.replace(/,/g, '')); kIn.value = isFinite(v) ? num(Math.round(v * st.rate)) : ''; tIn.classList.add('main'); kIn.classList.remove('main'); };
  kIn.oninput = function () { st.inCur = 'KRW'; var v = parseFloat(kIn.value.replace(/,/g, '')); tIn.value = isFinite(v) ? (Math.round(v / st.rate * 100) / 100) : ''; kIn.classList.add('main'); tIn.classList.remove('main'); };
  function pickOne(id, key) {
    els('#' + id + ' .pick', sh).forEach(function (b) { b.onclick = function () { if (!canEdit) return; st[key] = b.dataset.v; els('#' + id + ' .pick', sh).forEach(function (x) { x.classList.toggle('on', x === b); }); sync(); }; });
  }
  pickOne('x-cat', 'cat'); pickOne('x-payer', 'payer'); pickOne('x-kind', 'kind');
  els('#x-parts .pick', sh).forEach(function (b) {
    b.onclick = function () { if (!canEdit) return; var i = st.parts.indexOf(b.dataset.v); if (i >= 0) st.parts.splice(i, 1); else st.parts.push(b.dataset.v); b.classList.toggle('on', i < 0); };
  });
  function sync() {
    var cash = st.payer === '공금';
    if (cash) st.kind = '공동';
    els('#x-kind .pick', sh).forEach(function (x) { x.classList.toggle('on', x.dataset.v === st.kind); });
    el('#x-kind-box', sh).style.display = cash ? 'none' : '';
    el('#x-cash-note', sh).style.display = cash ? '' : 'none';
    el('#x-kind-help', sh).textContent = st.kind === '공동' ? '낸 사람이 받을 돈으로 계산되고, 함께한 사람끼리 똑같이 나눕니다.'
      : st.kind === '지원' ? '기록만 남고 정산에서는 빠집니다. 감사 보드에 이름이 올라갑니다. 🙏'
      : '지원한 금액만 빼고 나머지를 함께한 사람끼리 나눕니다.';
    el('#x-sup-box', sh).style.display = !cash && st.kind === '일부지원' ? '' : 'none';
    el('#x-parts-box', sh).style.display = cash || st.kind === '지원' ? 'none' : '';
  }
  sync();
  if (st.receipt) showReceipt(st.receipt, el('#x-rimg', sh), 'thumb');
  function onPick(inp) {
    inp.onchange = function () {
      var f = inp.files && inp.files[0]; if (!f) return;
      el('#x-rst', sh).textContent = '사진 줄이는 중…';
      var shot;
      shrinkImage(f, 1600, 0.8).then(function (dataUrl) {
        shot = dataUrl;
        el('#x-rimg', sh).innerHTML = '<img class="rimg" src="' + dataUrl + '">';
        el('#x-rst', sh).textContent = '영수증 올리는 중…';
        var saved = false, done = false;
        call('uploadReceipt', { dataUrl: dataUrl }).then(function (r) {
          st.receipt = r.id; saved = true;
          if (!done) el('#x-rst', sh).textContent = '✓ 영수증 저장됨 · 금액 읽는 중… ' + Math.round((Date.now() - t0) / 1000) + '초';
        }).catch(function (err) { el('#x-rst', sh).textContent = '영수증 저장 실패: ' + err.message; });
        // 금액 읽기는 60초까지만 기다림 (지난 초를 보여 줌)
        var t0 = Date.now();
        var tick = setInterval(function () {
          if (done) return clearInterval(tick);
          el('#x-rst', sh).textContent = (saved ? '✓ 영수증 저장됨 · ' : '영수증 올리는 중 · ') + '금액 읽는 중… ' + Math.round((Date.now() - t0) / 1000) + '초';
        }, 1000);
        var timer = setTimeout(function () {
          if (done) return; done = true;
          el('#x-rst', sh).textContent = (saved ? '✓ 영수증 저장됨 · ' : '') + '금액 읽기가 오래 걸려 멈췄습니다. 금액은 직접 적어 주세요.';
        }, 60000);
        // 금액 읽기는 더 작은 사진(긴 쪽 1024px)으로 보내 빠르게
        return shrinkImage(f, 1024, 0.7).then(function (small) { return call('recognize', { kind: 'receipt', dataUrl: small }); }).then(function (r) {
          if (done) return; done = true; clearTimeout(timer);
          applyReceipt(r.result || {});
        }, function (e) {
          if (done) return; done = true; clearTimeout(timer);
          el('#x-rst', sh).textContent = (saved ? '✓ 영수증 저장됨 · ' : '') + (e.message === 'NO_KEY' ? '자동 인식은 아직 설정 전' : '금액은 직접 적어 주세요 (' + e.message + ')');
        });
      }).catch(function (err) { el('#x-rst', sh).textContent = '영수증 저장 실패: ' + err.message; });
    };
  }
  /* 영수증에서 읽은 값을 노란 칸으로 채움 → 사람이 확인 후 저장 */
  function applyReceipt(r) {
    var filled = [];
    var total = Number(r.total);
    if (total > 0) {
      if (r.currency === 'KRW') { kIn.value = num(Math.round(total)); kIn.oninput(); kIn.classList.add('auto'); }
      else { tIn.value = Math.round(total * 100) / 100; tIn.oninput(); tIn.classList.add('auto'); }
      filled.push('금액');
    }
    if (r.store && !el('#x-title', sh).value) { el('#x-title', sh).value = r.store; el('#x-title', sh).classList.add('auto'); filled.push('가게'); }
    if (r.category && CATS.some(function (c) { return c[0] === r.category; })) {
      st.cat = r.category; els('#x-cat .pick', sh).forEach(function (x) { x.classList.toggle('on', x.dataset.v === r.category); });
    }
    if (r.date && dates().indexOf(r.date) >= 0) { el('#x-date', sh).value = r.date; el('#x-date', sh).classList.add('auto'); filled.push('날짜'); }
    el('#x-rst', sh).innerHTML = filled.length
      ? '✓ 영수증 저장됨 · <b style="background:var(--auto);padding:0 4px;border-radius:4px">노란 칸</b>은 자동으로 읽은 값입니다. 맞는지 꼭 확인해 주세요.'
      : '✓ 영수증 저장됨 · 금액을 읽지 못했습니다. 직접 적어 주세요.';
  }
  onPick(el('#x-cam', sh)); onPick(el('#x-pic', sh));
  el('#x-x', sh).onclick = closeSheet;
  if (el('#x-del', sh)) el('#x-del', sh).onclick = function () {
    confirmBox('이 지출을 지울까요?', '삭제').then(function (y) {
      if (!y) return;
      call('deleteExpense', { id: e.id }).then(function (r) { S.D.expenses = r.expenses; saveCache(); closeSheet(); renderMain(); toast('지웠습니다.'); }).catch(function (err) { toast(err.message); });
    });
  };
  if (el('#x-ok', sh)) el('#x-ok', sh).onclick = function () {
    var thb = parseFloat(tIn.value.replace(/,/g, '')), krw = parseFloat(kIn.value.replace(/,/g, ''));
    if (!(thb > 0)) { el('#x-msg', sh).textContent = '금액을 적어 주세요.'; return; }
    if (st.payer !== '공금' && st.kind === '일부지원') {
      var sup = parseFloat(el('#x-sup', sh).value.replace(/,/g, ''));
      if (!(sup > 0) || sup >= thb) { el('#x-msg', sh).textContent = '지원한 금액은 0보다 크고 전체 금액(' + thb + '바트)보다 작게 적어 주세요.'; return; }
    }
    var out = { id: isNew ? undefined : e.id, date: el('#x-date', sh).value, item_id: e.item_id || '', category: st.cat, title: el('#x-title', sh).value,
      thb: thb, krw: krw || Math.round(thb * st.rate), rate: st.rate, input_cur: st.inCur, payer: st.payer, kind: st.kind,
      support_thb: st.kind === '일부지원' ? parseFloat(el('#x-sup', sh).value.replace(/,/g, '')) : '', participants: st.parts, memo: el('#x-memo', sh).value, receipt_id: st.receipt || '' };
    el('#x-msg', sh).textContent = '저장 중…';
    call('saveExpense', { expense: out }).then(function (r) {
      S.D.expenses = r.expenses; saveCache(); closeSheet(); renderMain(); toast('저장했습니다. 모두에게 보입니다.');
    }).catch(function (err) { el('#x-msg', sh).textContent = err.message; });
  };
}

/* 사진 줄이기 (긴 쪽 maxPx, JPEG) */
function shrinkImage(file, maxPx, q) {
  return new Promise(function (res, rej) {
    var fr = new FileReader();
    fr.onload = function () {
      var img = new Image();
      img.onload = function () {
        var s = Math.min(1, maxPx / Math.max(img.width, img.height));
        var cv = document.createElement('canvas'); cv.width = Math.round(img.width * s); cv.height = Math.round(img.height * s);
        cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
        res(cv.toDataURL('image/jpeg', q));
      };
      img.onerror = function () { rej(new Error('사진을 읽지 못했습니다.')); };
      img.src = fr.result;
    };
    fr.onerror = function () { rej(new Error('사진을 읽지 못했습니다.')); };
    fr.readAsDataURL(file);
  });
}
